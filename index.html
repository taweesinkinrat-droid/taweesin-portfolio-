<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทวีสิน กลิ่นรัตน์ — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111417; --card:#1b2026; --card-2:#222931; --line:#2c353e;
  --text:#e8edf1; --muted:#95a3ae; --cyan:#22d3ee; --cyan-soft:rgba(34,211,238,.12);
  --gold:#f5c451; --silver:#cbd5dc; --bronze:#d99a62;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.wrap{width:min(1040px,100%);margin:0 auto}

/* ---------- profile header ---------- */
.cover{
  height:clamp(150px,26vw,280px);border-radius:0 0 var(--r) var(--r);overflow:hidden;position:relative;
  background:#0f2a33 url("images/photos/wrg-team.jpg") center 35%/cover;
}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,20,23,.05) 0%,rgba(17,20,23,.35) 55%,rgba(17,20,23,.97) 100%)}
.head{display:flex;align-items:flex-end;gap:20px;padding:0 24px;margin-top:-38px;position:relative;z-index:2;flex-wrap:wrap}
.avatar{
  width:150px;height:150px;border-radius:50%;border:5px solid var(--bg);background:#223 center/cover;flex:0 0 auto;
  box-shadow:0 0 0 2px var(--cyan),0 0 30px -6px rgba(34,211,238,.6);
}
.who{flex:1;min-width:220px;padding-bottom:10px}
.who h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.who .sub{color:var(--muted);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:.82rem;padding:3px 10px;border-radius:999px;background:rgba(27,32,38,.9);border:1px solid var(--line);backdrop-filter:blur(4px)}
.pill.hl{border-color:rgba(245,196,81,.5);color:var(--gold);background:rgba(30,24,10,.85)}
.head-actions{display:flex;gap:8px;padding-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:.95rem}
.btn-main{background:var(--cyan);color:#07202a}
.btn-sub{background:var(--card-2);border:1px solid var(--line);color:var(--text)}
.lang{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{padding:5px 11px;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--cyan);color:#07202a}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:0;z-index:20;background:rgba(17,20,23,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-top:14px;padding:10px 0;
}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:10px 16px;font-weight:600;font-size:.95rem;color:var(--muted);
  display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid transparent;
  background:var(--card);transition:background .15s,color .15s,border-color .15s,transform .15s;
}
.tab svg{width:18px;height:18px;flex:0 0 18px}
.tab:hover{color:var(--text);border-color:var(--line);transform:translateY(-1px)}
.tab.on{color:#07202a;background:var(--cyan);border-color:var(--cyan);box-shadow:0 4px 16px -4px rgba(34,211,238,.7)}
/* on narrow screens, wrap into rows instead of hiding tabs off-screen */
@media (max-width:700px){
  .tabs .wrap{flex-wrap:wrap;overflow-x:visible;justify-content:center;padding:0 10px}
  .tab{padding:8px 12px;font-size:.86rem;gap:6px}
  .tab svg{width:16px;height:16px;flex:0 0 16px}
}
.swipe-hint{
  text-align:center;font-size:.78rem;color:var(--muted);padding:8px 16px 0;opacity:1;
  transition:opacity .4s ease;display:flex;align-items:center;justify-content:center;gap:6px;
}
.swipe-hint.hide{opacity:0;height:0;padding:0;overflow:hidden}
.swipe-hint svg{width:14px;height:14px}

main{padding:18px 16px 60px}
.panel{display:none}
.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.card h2{font-size:1.2rem;margin-bottom:10px}
.card h3{font-size:1.05rem;line-height:1.35}
.muted{color:var(--muted)}
.cols{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}.head{justify-content:center;text-align:center}.who{text-align:center}.badge-row{justify-content:center}.head-actions{width:100%;justify-content:center}}

/* intro list */
.info{list-style:none;display:grid;gap:10px}
.info li{display:flex;gap:10px;align-items:flex-start}
.info svg{width:20px;height:20px;flex:0 0 20px;color:var(--muted);margin-top:3px}

/* photo grid (small) */
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:10px;overflow:hidden}
.mini-grid img{aspect-ratio:1;object-fit:cover;width:100%;cursor:zoom-in}

/* post (feed) */
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post-head .av{width:40px;height:40px;border-radius:50%;background:center/cover}
.post-head b{display:block;line-height:1.2}
.post-head small{color:var(--muted)}
.post p{margin-bottom:10px}
.tag-medal{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.m-gold{color:var(--gold);background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.4)}
.m-cyan{color:var(--cyan);background:var(--cyan-soft);border:1px solid rgba(34,211,238,.4)}
.pics{display:grid;gap:4px;border-radius:10px;overflow:hidden;margin-top:6px}
.pics.n1{grid-template-columns:1fr}
.pics.n2{grid-template-columns:1fr 1fr}
.pics.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.pics.n3 img:first-child{grid-row:1/3}
.pics.n4{grid-template-columns:1fr 1fr}
.pics img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;cursor:zoom-in;background:var(--card-2)}
.pics.n3 img:first-child{aspect-ratio:auto}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.8rem;padding:3px 10px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);color:#c9d4db}

/* filter chips */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:.92rem}
.filter.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.filter .n{opacity:.7;margin-left:4px;font-size:.8rem}

/* certificates */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cert{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:border-color .2s}
.cert:hover{border-color:var(--cyan)}
.cert img{width:100%;aspect-ratio:1.414;object-fit:cover;object-position:top;background:#fff}
.cert .t{padding:10px 12px}
.cert .t b{display:block;font-size:.92rem;line-height:1.4;font-weight:600}
.cert .t span{font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:480px){.cert-grid{grid-template-columns:1fr 1fr;gap:8px}.cert .t b{font-size:.84rem}}

/* photos */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in}
@media (max-width:480px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:3px}.photo-grid img{border-radius:4px}}

/* projects / 3D */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card .card-img{margin:-18px -18px 14px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.card .card-img img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
.bp{aspect-ratio:16/9;display:grid;place-items:center;color:var(--cyan);
  background:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,#13212a}
.bp svg{width:46%;height:70%}
.stl-viewer{position:relative;aspect-ratio:16/9;background:#0d1519;overflow:hidden;touch-action:none}
.stl-viewer canvas{display:block;width:100%!important;height:100%!important}
.stl-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:10px;gap:6px}
.stl-tag{position:absolute;top:8px;right:8px;font-size:.7rem;padding:3px 9px;border-radius:999px;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.4);color:var(--cyan);font-weight:600;letter-spacing:.03em;pointer-events:none;z-index:2}
ul.dots{padding-left:18px;margin:6px 0 10px}
ul.dots li{margin-bottom:4px}

/* videos */
.vid{aspect-ratio:16/9;background:var(--card-2);border-radius:10px;display:grid;place-items:center;color:var(--muted);overflow:hidden;margin:-4px 0 10px}
.vid iframe,.vid video{width:100%;height:100%;border:0}

/* timeline */
.tl{list-style:none;border-left:2px solid var(--line);padding-left:16px;display:grid;gap:14px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-23px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:6px}
.lb .cap{margin-top:12px;text-align:center;max-width:720px}
.lb .cap span{color:var(--muted);font-size:.85rem}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.4rem}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-close{top:14px;right:14px}.lb-prev{left:14px;top:50%}.lb-next{right:14px;top:50%}
@media (max-width:600px){.lb-prev,.lb-next{top:auto;bottom:18px}}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let certF="all";
function renderCerts(){
  const keys=["all","champ","award","join","course"];
  const list=CERTS.filter(c=>certF==="all"||c.type===certF);
  const k=grp(list.map(c=>({src:c.src,t:T(c.title),s:(L==="th"?"พ.ศ. ":"")+c.year})));
  const col={champ:"var(--gold)",award:"var(--silver)",join:"var(--cyan)",course:"#a78bfa"};
  document.getElementById("p-certs").innerHTML=`<div class="filters">${keys.map(x=>`<button class="filter ${x===certF?"on":""}" data-f="${x}">${T(UI[x])}<span class="n">${x==="all"?CERTS.length:CERTS.filter(c=>c.type===x).length}</span></button>`).join("")}</div>
   <div class="cert-grid">${list.map((c,i)=>`<div class="cert" data-g="${k}" data-i="${i}"><img src="${c.src}" loading="lazy" alt=""><div class="t"><b><span class="dot" style="background:${col[c.type]}"></span>${T(c.title)}</b><span>${L==="th"?"พ.ศ. ":""}${c.year}</span></div></div>`).join("")}</div>`;
}

/* tabs */
let cur=(location.hash||"#home").slice(1); if(!TABS.some(t=>t[0]===cur))cur="home";
let firstGo=true;
function go(t){cur=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
  history.replaceState(null,"","#"+t);
  const tabs=document.querySelector(".tabs");if(scrollY>tabs.offsetTop)scrollTo({top:tabs.offsetTop});
  document.querySelector(`.tab[data-t="${t}"]`)?.scrollIntoView({inline:"center",block:"nearest"});
  initStlViewers();
  setSwipeHintText();
  if(firstGo){firstGo=false;}else{hideSwipeHint();}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t)return go(t.dataset.t);
  const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
  const f=e.target.closest("[data-f]");if(f){certF=f.dataset.f;return renderCerts();}
  const im=e.target.closest("[data-g]");if(im)openLB(im.dataset.g,+im.dataset.i);
});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));render();go(cur);});

/* lightbox */
let LB=[],LI=0;const lb=document.getElementById("lb");
function openLB(k,i){LB=GROUPS[k]||[];LI=i;showLB();lb.classList.add("open");document.body.style.overflow="hidden"}
function showLB(){const it=LB[LI];if(!it)return;document.getElementById("lbImg").src=it.src;document.getElementById("lbT").textContent=it.t||"";document.getElementById("lbS").textContent=(it.s?it.s+" · ":"")+(LI+1)+" / "+LB.length}
function closeLB(){lb.classList.remove("open");document.body.style.overflow=""}
const step=d=>{LI=(LI+d+LB.length)%LB.length;showLB()};
document.getElementById("lbClose").onclick=closeLB;
document.getElementById("lbPrev").onclick=()=>step(-1);
document.getElementById("lbNext").onclick=()=>step(1);
lb.onclick=e=>{if(e.target===lb)closeLB()};
addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let sx=0;lb.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d>0?-1:1)});

/* swipe hint (mobile) — shown once, hidden after first tab change or swipe */
function setSwipeHintText(){document.getElementById("swipeHintTxt").textContent = L==="th"?"ปัดซ้าย-ขวาเพื่อเปลี่ยนหน้า":"Swipe left / right to switch pages";}
function hideSwipeHint(){document.getElementById("swipeHint").classList.add("hide");sessionStorage.setItem("hideSwipeHint","1");}
setSwipeHintText();
if(!matchMedia("(max-width:820px)").matches || sessionStorage.getItem("hideSwipeHint")) document.getElementById("swipeHint").classList.add("hide");

/* swipe between tabs on main content, Reels-style */
(function(){
  const mainEl=document.querySelector("main");
  let sx0=0, sy0=0, active=false;
  mainEl.addEventListener("touchstart",e=>{
    if(lb.classList.contains("open"))return;
    sx0=e.touches[0].clientX; sy0=e.touches[0].clientY; active=true;
  },{passive:true});
  mainEl.addEventListener("touchend",e=>{
    if(!active)return; active=false;
    if(lb.classList.contains("open"))return;
    const dx=e.changedTouches[0].clientX-sx0, dy=e.changedTouches[0].clientY-sy0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){
      const idx=TABS.findIndex(x=>x[0]===cur);
      hideSwipeHint();
      if(dx<0 && idx<TABS.length-1) go(TABS[idx+1][0]);
      else if(dx>0 && idx>0) go(TABS[idx-1][0]);
    }
  },{passive:true});
})();

/* ---------- STL 3D viewer (rotate/zoom with mouse or touch) ---------- */
function initStl(container){
  if(container.dataset.inited)return;
  const src=container.dataset.stl; if(!src)return;
  if(typeof THREE==="undefined")return;
  const w=container.clientWidth, h=container.clientHeight;
  if(!w||!h)return; /* panel still hidden — retry next time this tab is opened */
  container.dataset.inited="1";
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(45,w/h,0.1,2000);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h);
  container.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x1b2932,1.15));
  const dir=new THREE.DirectionalLight(0xffffff,.85); dir.position.set(4,6,5); scene.add(dir);
  const dir2=new THREE.DirectionalLight(0x22d3ee,.3); dir2.position.set(-4,-2,-3); scene.add(dir2);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=.08;
  controls.autoRotate=true; controls.autoRotateSpeed=1.6;
  controls.addEventListener("start",()=>controls.autoRotate=false);
  const loader=new THREE.STLLoader();
  loader.load(src, geo=>{
    const label=container.querySelector(".stl-loading"); if(label)label.remove();
    geo.computeVertexNormals(); geo.center(); geo.computeBoundingSphere();
    const r=(geo.boundingSphere&&geo.boundingSphere.radius)||40;
    const mat=new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.2,roughness:.45});
    scene.add(new THREE.Mesh(geo,mat));
    camera.position.set(r*1.7,r*1.3,r*1.7); camera.near=r/100; camera.far=r*50; camera.updateProjectionMatrix();
    controls.target.set(0,0,0); controls.update();
  }, undefined, ()=>{
    const label=container.querySelector(".stl-loading");
    if(label)label.textContent = L==="th" ? "โหลดไฟล์ 3D ไม่สำเร็จ ตรวจสอบพาธไฟล์ .stl" : "Couldn't load the 3D file — check the .stl path";
  });
  new ResizeObserver(()=>{
    const w2=container.clientWidth,h2=container.clientHeight; if(!w2||!h2)return;
    renderer.setSize(w2,h2); camera.aspect=w2/h2; camera.updateProjectionMatrix();
  }).observe(container);
  (function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
}
function initStlViewers(){document.querySelectorAll(".stl-viewer[data-stl]").forEach(initStl)}

render();go(cur);
</script>
