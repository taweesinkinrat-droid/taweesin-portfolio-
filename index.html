  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.filters.at-end{-webkit-mask-image:none;mask-image:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:.9rem;transition:transform .15s ease,border-color .15s ease}
.filter:active{transform:scale(.95)}
.filter.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.filter .n{opacity:.7;margin-left:5px;font-size:.78rem}

/* certificates */
.cert{height:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:border-color .2s,transform .2s ease,box-shadow .2s ease}
@media (hover:hover){.cert:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}}
.cert:active{transform:scale(.97)}
.cert img{width:100%;aspect-ratio:1.414;object-fit:cover;object-position:top;background:#fff}
.cert .t{padding:10px 12px}
.cert .t b{display:block;font-size:.9rem;line-height:1.4;font-weight:600}
.cert .t span{font-size:.78rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
@media (max-width:575.98px){.cert .t{padding:8px 10px}.cert .t b{font-size:.82rem}}

/* photos */
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
@media (max-width:575.98px){.photo-grid img{border-radius:6px}}

/* projects / 3D */
.proj-video{aspect-ratio:16/9;border-radius:var(--r) var(--r) 0 0;overflow:hidden;margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 16px;background:#000}
.proj-video video{width:100%;height:100%;display:block;object-fit:cover}
.pdf-btn{margin-top:12px}
.proj-team{font-size:.88rem;margin:6px 0;color:#c9d4db}
.proj-team b{color:var(--cyan);font-weight:700}
.proj-result{font-size:.94rem;margin:8px 0;color:var(--gold);font-weight:600}
.bp{aspect-ratio:16/9;display:grid;place-items:center;color:var(--cyan);
  background:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,#13212a}
.bp svg{width:46%;height:70%}
.stl-viewer{position:relative;aspect-ratio:16/10;overflow:hidden;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 60%,#14262e 0%,#0d1519 70%);transition:box-shadow .2s}
.stl-viewer canvas{display:block;width:100%;height:100%}
.stl-viewer.active{touch-action:none;box-shadow:inset 0 0 0 2px var(--cyan)}
.stl-hint{position:absolute;left:10px;bottom:10px;z-index:2;max-width:calc(100% - 20px);font-size:.74rem;line-height:1.3;
  padding:5px 10px;border-radius:999px;background:rgba(10,16,20,.8);border:1px solid var(--line);color:#cfe3ea;
  pointer-events:none;transition:opacity .35s,border-color .2s,color .2s}
.stl-viewer.active .stl-hint{border-color:rgba(34,211,238,.55);color:var(--cyan)}
@media (hover:hover){.stl-viewer.used .stl-hint{opacity:0}}
.stl-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:10px;gap:6px}
.stl-tag{position:absolute;top:8px;right:8px;font-size:.7rem;padding:3px 9px;border-radius:999px;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.4);color:var(--cyan);font-weight:600;letter-spacing:.03em;pointer-events:none;z-index:2}
#p-design .card h3{margin-bottom:4px}
#p-design .card p{font-size:.92rem}
ul.dots{padding-left:20px;margin:8px 0 4px}
ul.dots li{margin-bottom:4px}
ul.dots li::marker{color:var(--cyan)}

/* Smart Classroom: wide feature on desktop, stacked on smaller screens */
.proj-smart{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start}
.proj-smart>*{min-width:0}
.proj-smart .media-top{margin:0;border-radius:12px}
.proj-smart .media-top img{object-fit:contain;background:var(--card-2)}
.proj-smart .pics{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.proj-smart .pics img{height:auto;aspect-ratio:4/3;object-fit:contain;background:var(--card-2)}
@media (max-width:991.98px){.proj-smart{grid-template-columns:minmax(0,1fr);gap:16px}}

/* videos */
.vid{aspect-ratio:16/9;background:var(--card-2);border-radius:12px;display:grid;place-items:center;color:var(--muted);overflow:hidden;margin-bottom:12px;position:relative;text-align:center;padding:0 12px}
.vid:has(iframe),.vid:has(.vid-poster){padding:0}
.vid iframe,.vid video{width:100%;height:100%;border:0}
.vid-poster{position:absolute;inset:0;cursor:pointer;background:#000}
.vid-poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75}
.vid-play{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:rgba(17,20,23,.75);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;color:var(--cyan);transition:transform .15s,background .15s}
.vid-poster:hover .vid-play{transform:scale(1.08);background:var(--cyan);color:#06222b}
.vid-play svg{width:24px;height:24px;margin-left:3px}

/* timeline */
.tl{list-style:none;border-left:2px solid var(--line);padding-left:18px;display:grid;gap:14px;margin-left:6px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,8,10,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:1100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-width:min(100%,1200px);max-height:78vh;border-radius:8px;box-shadow:0 20px 60px -20px #000}
.lb .cap{margin-top:12px;text-align:center;max-width:720px;padding:0 50px}
.lb .cap span{color:var(--muted);font-size:.85rem}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.4rem;color:#fff}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-close{top:calc(14px + env(safe-area-inset-top));right:14px}.lb-prev{left:14px;top:50%;transform:translateY(-50%)}.lb-next{right:14px;top:50%;transform:translateY(-50%)}
@media (max-width:600px){.lb-prev,.lb-next{top:auto;bottom:calc(18px + env(safe-area-inset-bottom));transform:none}.lb .cap{padding:0 56px}}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:22px 0}
footer .container-xl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
footer .priv{flex-basis:100%;font-size:.72rem;color:#6f7d88;opacity:.85}
@media (max-width:575.98px){footer .container-xl{justify-content:center;text-align:center}}
.to-top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:46px;height:46px;border-radius:50%;
  background:var(--cyan);color:#06222b;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -4px rgba(34,211,238,.6);opacity:0;transform:translateY(12px) scale(.8);
  pointer-events:none;transition:opacity .25s ease,transform .25s ease,bottom .25s ease}
.to-top svg{width:22px;height:22px}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:active{transform:scale(.9)}

/* motion polish — GSAP drives it when available; plain CSS transitions are the fallback */
.intro .cover-img,.intro .head,.intro .tabs .tab,.intro .tab-ink{opacity:0}
/* scroll-reveal runs as a CSS transition → the GPU animates it, the main thread stays free for scrolling */
.reveal{transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1)}
.reveal:not(.in){opacity:0;transform:translateY(18px)}
.card.reveal.done{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.cert.reveal.done{transition:border-color .2s,transform .2s ease,box-shadow .2s ease}
@media (hover:hover){
  .card .media-top img,.cert img,.pics img{transition:transform .35s cubic-bezier(.22,.61,.36,1)}
  .card:hover .media-top img,.cert:hover img,.pics img:hover{transform:scale(1.045)}
  .mini-grid img,.photo-grid img{transition:filter .2s ease}
  .mini-grid img:hover,.photo-grid img:hover{filter:brightness(1.12)}
}
/* ---------- extras ---------- */
/* reading-progress line along the very top */
.progress-top{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--cyan),var(--cyan-2),#a5f3fc);box-shadow:0 0 10px rgba(34,211,238,.7)}
/* back-to-top button doubles as a progress ring */
.to-top{background:conic-gradient(#e9fdff var(--p,0deg),rgba(6,34,43,.35) 0)}
.to-top::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--cyan)}
.to-top svg{position:relative}
/* sliding highlight behind the active section tab (tablet + desktop) */
.tab-ink{display:none}
@media (min-width:701px){
  .has-ink{position:relative}
  .has-ink .tab{position:relative;z-index:1}
  .has-ink .tab.on{background:transparent;border-color:transparent;box-shadow:none}
  .has-ink .tab-ink{display:block;position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;z-index:0;pointer-events:none;
    background:var(--cyan);box-shadow:0 4px 18px -4px rgba(34,211,238,.75);
    transition:transform .45s cubic-bezier(.22,.61,.36,1),width .45s cubic-bezier(.22,.61,.36,1),height .3s ease,opacity .3s;
    will-change:transform,width} /* own GPU layer: the slide keeps moving even while a big page is being laid out */
}
@media (min-width:701px) and (max-width:991.98px){.has-ink .tab-ink{border-radius:12px}}
/* soft cyan spotlight that follows the mouse across cards (desktop) */
@media (hover:hover) and (pointer:fine){
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(34,211,238,.075),transparent 45%)}
  .card:hover::after{opacity:1}
  #p-design .card::after{display:none}
  .hl-item{position:relative;overflow:hidden}
  .hl-item::before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-18deg);transition:left .6s ease}
  .hl-item:hover::before{left:120%}
  .gs .cert:hover{transform:none}
}
/* shimmer placeholder while photos load */
@keyframes shimmer{to{background-position:-200% 0}}
.pics img:not(.ok),.cert img:not(.ok),.photo-grid img:not(.ok),.mini-grid img:not(.ok),.media-top img:not(.ok){
  background:linear-gradient(100deg,var(--card-2) 30%,#2c353f 50%,var(--card-2) 70%) 0 0/200% 100%;animation:shimmer 1.3s linear infinite}
/* the photo glows a little on hover */
@media (hover:hover){.avatar{transition:transform .35s cubic-bezier(.22,.61,.36,1)}.avatar:hover{transform:scale(1.04) rotate(-2deg)}}
/* ---------- competition journey (timeline) ---------- */
.journey .card-head{margin-bottom:6px}
.j-range{font-size:.85rem;font-weight:700;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.j-range b{color:var(--gold)}
.j-track{overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:10px var(--pad) 4px;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad),#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad),#000 calc(100% - 34px),transparent 100%)}
.j-track::-webkit-scrollbar{display:none}
.j-wrap{position:relative}
.j-arrow{position:absolute;top:2px;z-index:3;width:38px;height:38px;border-radius:50%;display:none;place-items:center;
  background:rgba(26,31,37,.92);border:1px solid var(--line-2);color:var(--text);box-shadow:0 6px 16px -6px #000;transition:opacity .2s,border-color .2s,color .2s}
.j-arrow svg{width:18px;height:18px}
.j-arrow:hover{border-color:var(--cyan);color:var(--cyan)}
.j-arrow.l{left:-6px}.j-arrow.r{right:-6px}
@media (hover:hover) and (pointer:fine){.j-wrap.can-l .j-arrow.l,.j-wrap.can-r .j-arrow.r{display:grid}
  .j-wrap.scrollable .j-track{cursor:grab}.j-wrap.dragging .j-track{cursor:grabbing;scroll-snap-type:none}
  .j-wrap.dragging .j-item button{pointer-events:none}}
.j-track.at-end{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad));mask-image:linear-gradient(90deg,transparent 0,#000 var(--pad))}
.j-list{--n:7;--col:150px;list-style:none;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;width:100%;min-width:calc(var(--n) * var(--col) + (var(--n) - 1) * 8px)}
.j-line{position:absolute;left:calc(100% / 14);right:calc(100% / 14);top:22px;height:3px;border-radius:3px;background:var(--line)}
.j-line i{position:absolute;inset:0;border-radius:inherit;transform-origin:0 50%;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.22,.61,.36,1) .15s;
  background:linear-gradient(90deg,var(--cyan) 0%,var(--cyan-2) 55%,var(--gold) 100%);box-shadow:0 0 12px rgba(34,211,238,.45)}
.journey.in .j-line i,.journey:not(.reveal) .j-line i{transform:scaleX(1)}
.j-item{scroll-snap-align:start;position:relative;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.61,.36,1);transition-delay:calc(var(--i) * 90ms + .1s)}
.journey.in .j-item,.journey:not(.reveal) .j-item{opacity:1;transform:none}
.j-item button{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:0 4px 8px;border-radius:14px}
.j-dot{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;margin-bottom:6px;
  background:var(--card-2);border:2px solid var(--line-2);transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s,border-color .25s}
.k-gold .j-dot,.k-royal .j-dot{border-color:rgba(245,196,81,.75);background:radial-gradient(circle at 50% 35%,#3a3220,#211d14)}
.k-medal .j-dot{border-color:rgba(203,213,220,.6)}
.k-intl .j-dot{border-color:rgba(34,211,238,.7)}
.k-next .j-dot{border-color:var(--cyan);background:#0f2a33}
.k-next .j-dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--cyan);opacity:0;animation:jPulse 2.2s ease-out infinite}
@keyframes jPulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.j-dot .flag{width:24px;height:16px}
.j-date{font-size:.74rem;font-weight:700;color:var(--cyan);letter-spacing:.02em}
.k-gold .j-date,.k-royal .j-date{color:var(--gold)}
.j-item b{font-size:.86rem;line-height:1.35}
.j-item small{font-size:.74rem;line-height:1.35;color:var(--muted)}
.j-next-tag{display:inline-block;margin-top:3px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#06222b;background:var(--cyan)}
@media (hover:hover){
  .j-item button:hover .j-dot{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 22px -6px rgba(34,211,238,.55)}
  .k-gold button:hover .j-dot,.k-royal button:hover .j-dot{box-shadow:0 8px 22px -6px rgba(245,196,81,.55)}
  .j-item button:hover b{color:#fff}
}
@media (max-width:575.98px){.j-list{--col:146px}}

/* ---------- Robotics page contents (wide screens) ---------- */
.toc{position:sticky;top:92px;padding:6px 0 6px 2px;border-left:2px solid var(--line)}
.toc-h{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 14px}
.toc button{position:relative;display:block;width:100%;text-align:left;padding:8px 10px 8px 14px;border-radius:0 10px 10px 0;transition:background .2s,color .2s}
.toc button::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:2px;border-radius:2px;background:transparent;transition:background .2s,box-shadow .2s}
.toc button:hover{background:rgba(255,255,255,.03)}
.toc button.on{background:var(--cyan-soft)}
.toc button.on::before{background:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.8)}
.toc-d{display:block;font-size:.72rem;font-weight:700;color:var(--muted)}
.toc-t{display:block;font-size:.88rem;font-weight:600;line-height:1.35;color:#c9d4db}
.toc button.on .toc-d{color:var(--cyan)}.toc button.on .toc-t{color:#fff}

/* ---------- Photos: masonry — every photo keeps its own shape, nothing cropped ---------- */
.masonry{columns:2;column-gap:8px}
@media (min-width:768px){.masonry{columns:3;column-gap:12px}}
@media (min-width:1200px){.masonry{columns:4}}
.masonry img{width:100%;margin:0 0 8px;border-radius:12px;break-inside:avoid;cursor:zoom-in;display:block}
@media (min-width:768px){.masonry img{margin-bottom:12px}}
.masonry img:not(.ok){min-height:160px;background:linear-gradient(100deg,var(--card-2) 30%,#2c353f 50%,var(--card-2) 70%) 0 0/200% 100%;animation:shimmer 1.3s linear infinite}
@media (hover:hover){.masonry img{transition:filter .2s,transform .3s cubic-bezier(.22,.61,.36,1)}.masonry img:hover{filter:brightness(1.1);transform:translateY(-2px)}}

/* ---------- résumé (print / PDF only) ---------- */
.btn-resume svg{width:17px;height:17px}
#resume{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(#resume){display:none!important}
  #resume{display:block!important}
}

.rs-proj b{font-size:8.8pt;color:#0d1620}
.rs-proj small{display:block;font-size:7.8pt;color:#4a5866;line-height:1.4}
.rs-about{font-size:8.4pt;color:#2b3846}
.rs-foot{margin-top:3mm;padding-top:2.5mm;border-top:1px solid #d6e3e8;font-size:7.6pt;color:#55636f;display:flex;justify-content:space-between;gap:4mm}
.rs-foot b{color:#0a8aa1}
.rs a{color:inherit;text-decoration:none}
.rs-foot a b{text-decoration:underline;text-underline-offset:2px}

/* ---------- profile photo: slowly orbiting cyan→gold ring ---------- */
.avatar{position:relative}
.avatar::before{content:"";position:absolute;inset:-9px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(34,211,238,0) 0deg,var(--cyan) 70deg,rgba(34,211,238,0) 140deg,rgba(245,196,81,0) 180deg,var(--gold) 250deg,rgba(245,196,81,0) 320deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
  animation:orbit 7s linear infinite;opacity:.95}
@keyframes orbit{to{transform:rotate(360deg)}}

/* ---------- name: a soft light sweeps across it now and then ---------- */
.who h1.shine{background:linear-gradient(100deg,#fff 0%,#fff 42%,#a5f3fc 50%,#fff 58%,#fff 100%) 0 0/260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 12px rgba(0,0,0,.65));
  background-position:100% 0}
.who h1.shine.sweep{animation:nameShine 1.75s ease-in-out}
@keyframes nameShine{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- timeline: a spark keeps travelling along the line ---------- */
.j-line::after{content:"";position:absolute;top:50%;left:0;right:0;height:9px;margin-top:-4.5px;opacity:0;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(23px 4px at calc(100% - 23px) 50%,#fff 0%,rgba(165,243,252,.85) 40%,rgba(34,211,238,0) 100%);transform:translateX(-100%)}
.journey.in .j-line::after{animation:jSpark 3.6s cubic-bezier(.45,0,.55,1) 1.7s infinite}
@keyframes jSpark{0%{transform:translateX(-100%);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(0);opacity:0}}
/* nothing animates while it's off-screen */
.journey.off .j-line::after,.journey.off .k-next .j-dot::after{animation-play-state:paused}
.hero.off .avatar::before,.hero.off .avatar::after{animation-play-state:paused}
.journey.in .j-item .j-dot{animation:jPop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i) * 90ms + .15s)}
@keyframes jPop{from{transform:scale(.4)}to{transform:scale(1)}}

/* ---------- photos in cards settle in (slight zoom-out) as the card appears ---------- */
.card.reveal:not(.in) .pics img,.card.reveal:not(.in) .media-top img{transform:scale(1.1)}
@media (hover:none){.pics img,.media-top img{transition:transform .9s cubic-bezier(.22,.61,.36,1)}}

/* ---------- highlight icons bob in one after another ---------- */
.card.reveal.in .hl-ico{animation:icoIn .6s cubic-bezier(.34,1.56,.64,1) both}
.card.reveal.in li:nth-child(2) .hl-ico{animation-delay:.08s}.card.reveal.in li:nth-child(3) .hl-ico{animation-delay:.16s}
.card.reveal.in li:nth-child(4) .hl-ico{animation-delay:.24s}.card.reveal.in li:nth-child(5) .hl-ico{animation-delay:.32s}
@keyframes icoIn{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- private statistics page (5 taps on the profile photo) ---------- */
#stats{position:fixed;inset:0;z-index:5000;background:#0b0e11;color:#dfe7ec;overflow:auto;font-size:14px;line-height:1.5;-webkit-overflow-scrolling:touch}
#stats .st-in{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
#stats .st-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:0;background:#0b0e11;padding:8px 0;z-index:2}
#stats h2{font-size:1.15rem;margin:0}#stats h3{font-size:.95rem;margin:0 0 8px;color:#22d3ee}
#stats button,#stats select,#stats input{font:inherit;color:#e8edf1;background:#1a1f25;border:1px solid #2c353e;border-radius:8px;padding:6px 10px}
#stats button:hover{border-color:#22d3ee}
#stats .st-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
#stats .st-card{background:#14191e;border:1px solid #232b33;border-radius:10px;padding:10px 12px}
#stats .st-card b{display:block;font-size:1.5rem;color:#fff}#stats .st-card span{color:#8796a1;font-size:.8rem}
#stats .st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:14px}
#stats .st-box{background:#14191e;border:1px solid #232b33;border-radius:10px;padding:12px;min-width:0}
#stats table{width:100%;border-collapse:collapse;font-size:.85rem}#stats td,#stats th{padding:4px 6px;border-bottom:1px solid #1f262d;text-align:left;vertical-align:top}
#stats th{color:#8796a1;font-weight:600}#stats td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#stats .st-bar{height:6px;border-radius:3px;background:#22d3ee;opacity:.75}
#stats .st-days{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
#stats .st-days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.66rem;color:#8796a1;min-width:0}
#stats .st-days i{display:block;width:100%;background:#22d3ee;border-radius:3px 3px 0 0;min-height:2px}
#stats .st-visit{background:#14191e;border:1px solid #232b33;border-radius:10px;padding:10px 12px;margin-bottom:8px}
#stats .st-visit summary{cursor:pointer;list-style:none}#stats .st-visit summary::-webkit-details-marker{display:none}
#stats .st-meta{color:#8796a1;font-size:.8rem}#stats .st-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#stats .st-tags span{font-size:.75rem;padding:1px 7px;border-radius:999px;background:#1e2a31;border:1px solid #29404a;color:#a5f3fc}
#stats .st-tags span.g{background:#2b2513;border-color:#5a4a1c;color:#f5c451}
#stats .st-login{max-width:340px;margin:18vh auto 0;display:grid;gap:10px;text-align:center}
#stats .st-err{color:#fca5a5;font-size:.85rem;min-height:1.2em}

/* ---------- opening splash (first visit per session) ---------- */
#splash{display:none}
.splash #splash{display:block;position:fixed;inset:0;z-index:3000;cursor:pointer}
.splash body{overflow:hidden}
.sp-half{position:absolute;left:0;right:0;height:50.5%;background:var(--bg);will-change:transform}
.sp-half.t{top:0;background:radial-gradient(120% 90% at 50% 100%,#0f2a33 0%,var(--bg) 60%)}
.sp-half.b{bottom:0;background:radial-gradient(120% 90% at 50% 0%,#0f2a33 0%,var(--bg) 60%)}
.sp-grid{position:absolute;inset:0;opacity:.35;
  background:linear-gradient(rgba(34,211,238,.08) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(34,211,238,.08) 1px,transparent 1px) 0 0/44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 65%);mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 65%);animation:spGrid 6s linear infinite}
@keyframes spGrid{to{background-position:0 44px,44px 0}}
.sp-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.sp-ring{position:relative;width:132px;height:132px;animation:spIn .7s cubic-bezier(.22,.61,.36,1) both}
.sp-ring i{position:absolute;inset:14px;border-radius:50%;background:#223 url(images/photos/profile.jpg) 58% 40%/260% auto;box-shadow:0 0 40px -6px rgba(34,211,238,.7)}
.sp-ring svg{position:absolute;inset:0;width:100%;height:100%;animation:spSpin 1.6s linear infinite}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.sp-name{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;letter-spacing:.01em;color:#fff;text-shadow:0 0 24px rgba(34,211,238,.45)}
.sp-name span{display:inline-block;opacity:0;transform:translateY(14px);animation:spCh .5s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes spCh{to{opacity:1;transform:none}}
.sp-sub{font-size:.8rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);opacity:0;animation:spFade .6s .55s forwards}
@keyframes spFade{to{opacity:.9}}
@media (max-width:575.98px){.sp-sub{font-size:.66rem;letter-spacing:.2em}}
.sp-bar{width:min(220px,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.sp-bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),var(--gold));animation:spBar 1.5s cubic-bezier(.65,0,.35,1) .2s forwards}
@keyframes spBar{to{transform:scaleX(1)}}
.sp-skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted);opacity:0;animation:spFade .5s 1s forwards}

/* ---------- living cover: drifting circuit points ---------- */
.cover-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95}

/* ---------- shine across the champion badge ---------- */
.pill.top{position:relative;overflow:hidden}
.pill.top::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;transform:translateX(-130%) skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.55),transparent)}
.pill.top.sweep::after{animation:badgeShine 1.1s ease-in-out}
@keyframes badgeShine{from{transform:translateX(-130%) skewX(-20deg)}to{transform:translateX(270%) skewX(-20deg)}}

/* ---------- card heading accent grows in with the card ---------- */
.card h2::before{transform-origin:50% 100%;transition:transform .6s cubic-bezier(.22,.61,.36,1) .25s}
.card.reveal:not(.in) h2::before{transform:scaleY(0)}

/* ---------- name rises letter by letter (grapheme-safe for Thai) ---------- */
.who h1 .ch{display:inline-block;white-space:pre}

/* ---------- desktop: soft light that follows the mouse across the page ---------- */
.cursor-glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(34,211,238,.07) 0%,rgba(34,211,238,.025) 35%,transparent 65%);opacity:0;transition:opacity .4s;will-change:transform}
.cursor-glow.on{opacity:1}

/* ---------- touch: ripple on tap ---------- */
/* overflow:clip clips the ripple without turning the button into a scroll container, so a flex
   row can never squash the tapped button (overflow:hidden did, and the tap landed on the next chip) */
.rpl{position:relative;overflow:clip}
@supports not (overflow:clip){.rpl{overflow:hidden}}
.rpl-dot{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.28);transform:scale(0);animation:rpl .55s ease-out forwards}
.tab.on .rpl-dot,.btn-cyan .rpl-dot,.mb-cur .rpl-dot{background:rgba(6,34,43,.25)}
@keyframes rpl{to{transform:scale(1);opacity:0}}

/* =====================================================================
   PHONE LAYOUT (≤700px) — app-style: centred profile, slim top bar,
   bottom navigation, big section heading, roomier cards
   ===================================================================== */
.appbar,.bnav,.phead{display:none}
@media (max-width:700px){
  :root{--pad:18px;--r:18px;--ab-h:56px;--bn-h:64px}
  html{scroll-padding-top:calc(var(--ab-h) + 12px)}
  body{padding-bottom:calc(var(--bn-h) + env(safe-area-inset-bottom))}
  .minibar{display:none!important}
  /* the old tab grid becomes an invisible zero-height marker: it still tells the scripts where the content starts */
  .tabs{height:0;margin:0!important;padding:0!important;overflow:hidden;border:0;visibility:hidden}

  /* ---- profile header: everything centred, clear hierarchy, two big action buttons ---- */
  .cover{height:212px}
  .cover::after{background:linear-gradient(180deg,rgba(17,20,23,.05) 0%,rgba(17,20,23,.18) 45%,rgba(17,20,23,.78) 80%,var(--bg) 100%)}
  .head{grid-template-columns:minmax(0,1fr);grid-template-areas:"av" "who" "act";justify-items:center;text-align:center;
    margin-top:-64px;padding:0 20px;row-gap:0}
  .avatar{width:116px;height:116px}
  .who{margin-top:14px;width:100%}
  .who h1{font-size:1.75rem;letter-spacing:-.01em}
  .who .sub{font-size:.93rem;max-width:34ch;margin:6px auto 0;color:#aebbc5}
  .badge-row{justify-content:center;gap:7px;margin-top:14px}
  .pill{font-size:.78rem;padding:5px 11px}
  .pill.top{font-size:.92rem;padding:7px 16px}
  .head-actions{justify-self:stretch;width:100%;max-width:440px;margin:18px auto 0;padding:0;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px}
  .head-actions .btn{height:46px;border-radius:14px;--bs-btn-font-size:.95rem;--bs-btn-padding-x:.6rem}
  .head-actions .btn-resume{display:inline-flex!important}
  .head-actions .lang{height:46px;border-radius:14px;align-items:center}
  .head-actions .lang button{height:38px;padding:0 11px;border-radius:11px}

  .swipe-hint{margin-top:14px}
  main{padding-top:14px}

  /* ---- section heading: where am I, and what's next ---- */
  .phead{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
  .ph-ic{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;color:var(--cyan);
    background:linear-gradient(145deg,rgba(34,211,238,.2),rgba(34,211,238,.05));border:1px solid rgba(34,211,238,.35)}
  .ph-ic svg{width:22px;height:22px}
  .ph-t{flex:1;min-width:0}
  .ph-t h2{font-size:1.32rem;font-weight:700;line-height:1.2;margin:0}
  .ph-t small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
  .ph-nav{display:flex;gap:6px}
  .ph-nav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
  .ph-nav button:disabled{opacity:.3}
  .ph-nav svg{width:19px;height:19px}

  /* ---- cards & content: more air, calmer edges ---- */
  .stack>*+*{margin-top:14px}
  .card h2{font-size:1.1rem}
  .filters{position:sticky;top:var(--ab-h);z-index:6;margin:0 -16px 14px;padding:10px 16px;background:linear-gradient(var(--bg) 78%,rgba(17,20,23,0))}
  .filter{height:40px;padding:0 15px;display:inline-flex;align-items:center;font-size:.88rem}
  .to-top{bottom:calc(var(--bn-h) + 14px + env(safe-area-inset-bottom))!important;width:44px;height:44px}
  footer{padding-bottom:28px!important}

  /* robot posts: one card instead of boxes inside boxes — a thin accent line per step, photos run edge to edge */
  .story{border:0;background:none;border-radius:0;margin:8px 0 2px}
  .story .srow{position:relative;padding:11px 0 11px 14px;border-top:0;gap:3px}
  .story .srow::before{content:"";position:absolute;left:0;top:13px;bottom:11px;width:2px;border-radius:2px;background:rgba(34,211,238,.4)}
  .story .srow.result{margin:4px 0;padding:12px 14px;border-radius:12px;background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.22)}
  .story .srow.result::before{display:none}
  .post>.pics:last-child{margin:14px calc(-1*var(--pad)) calc(-1*var(--pad));border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px);gap:2px}
  .post-head .av{width:42px;height:42px;flex-basis:42px}

  /* ---- slim top bar ---- */
  .appbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:45;height:var(--ab-h);align-items:center;gap:8px;
    padding:0 12px 0 10px;padding-top:env(safe-area-inset-top);background:#13171b;border-bottom:1px solid var(--line);
    box-shadow:0 8px 22px -14px rgba(0,0,0,.9);transform:translateY(-105%);transition:transform .28s cubic-bezier(.22,.61,.36,1)}
  body.ab-on .appbar{transform:none}
  .ab-me{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px}
  .ab-me i{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#223 center/cover;border:2px solid var(--cyan);box-shadow:0 0 10px -3px rgba(34,211,238,.7)}
  .ab-txt{min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .ab-txt b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ab-txt small{font-size:.74rem;color:var(--cyan);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ab-btn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;color:var(--text);background:var(--card);border:1px solid var(--line)}
  .ab-btn svg{width:19px;height:19px}
  .ab-lang{padding:2px;border-radius:12px}
  .ab-lang button{padding:7px 9px;font-size:.76rem}

  /* ---- bottom navigation ---- */
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:44;
    height:calc(var(--bn-h) + env(safe-area-inset-bottom));padding:6px 4px env(safe-area-inset-bottom);
    background:#13171b;border-top:1px solid var(--line);box-shadow:0 -10px 26px -16px rgba(0,0,0,.95)}
  .bn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:0;color:var(--muted);
    font-size:.68rem;font-weight:600;line-height:1.2;padding-top:2px;-webkit-tap-highlight-color:transparent}
  .bn-ic{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .25s ease,color .25s ease}
  .bn-ic svg{width:21px;height:21px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .bn span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .bn.on{color:var(--text)}
  .bn.on .bn-ic{background:var(--cyan);color:#06222b;box-shadow:0 4px 14px -5px rgba(34,211,238,.8)}
  .bn.on .bn-ic svg{transform:scale(1.06)}
  .bn:active .bn-ic svg{transform:scale(.88)}

  /* ---- section picker sheet: big two-column tiles ---- */
  .sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sheet-grid .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:58px;border-radius:14px;font-size:.92rem;text-align:left}
  .sheet-grid .tab svg{width:21px;height:21px;flex:0 0 21px}
  .sheet .offcanvas-header{padding:12px 18px 8px}
  .sheet .offcanvas-body{padding:6px 16px 20px}
}
@media (max-width:359.98px){
  .head-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .head-actions .lang{grid-column:1/-1;justify-self:center}
  .bn{font-size:.62rem}.bn-ic{width:48px}
  .ab-lang{display:none}
}
/* ---------- quick search ---------- */
.tab-search{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:999px;color:var(--muted);
  background:var(--card);border:1px solid var(--line);font-size:.85rem;transition:color .15s,border-color .15s}
.tab-search svg{width:18px;height:18px}
.tab-search:hover{color:var(--cyan);border-color:var(--cyan)}
.qs-foot kbd{font:600 .7rem/1 inherit;padding:3px 6px;border-radius:6px;background:var(--card-2);border:1px solid var(--line-2);color:#c7d2da}
.tab-search .ts-t{font-weight:600}
@media (max-width:1439.98px){.tab-search .ts-t{display:none}.tab-search{width:40px;padding:0;justify-content:center}}
.qs{position:fixed;inset:0;z-index:1090;display:none;background:rgba(6,9,11,.72);padding:10vh 16px 16px}
.qs.open{display:block;animation:fade .18s ease}
@media (hover:hover) and (pointer:fine){.qs{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}}
.qs-box{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(34,211,238,.08);display:flex;flex-direction:column;max-height:76vh;animation:qsIn .22s cubic-bezier(.22,.61,.36,1)}
@keyframes qsIn{from{transform:translateY(-10px) scale(.98);opacity:0}}
.qs-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qs-top>svg{width:20px;height:20px;color:var(--cyan);flex:0 0 20px}
.qs-top input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:1.05rem;padding:6px 0}
.qs-top input::-webkit-search-cancel-button{display:none}
.qs-close{font-size:.8rem;color:var(--muted);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card-2)}
.qs-list{overflow:auto;padding:6px;overscroll-behavior:contain}
.qs-h{font-size:.74rem;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.qs-it{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent}
.qs-it.on{background:var(--cyan-soft);border-color:rgba(34,211,238,.35)}
@media (hover:hover){.qs-it:hover{background:var(--card-2)}}

/* =====================================================================
   GLASS — frosted cards over a soft coloured glow (no per-card blur, so it stays smooth on phones)
   ===================================================================== */
:root{--amb:rgba(34,211,238,.26);
  --glass:linear-gradient(155deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.028) 38%,rgba(255,255,255,.012) 100%),rgba(21,26,32,.6);
  --glass-2:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),rgba(28,34,41,.55);
  --glass-line:rgba(255,255,255,.085);--glass-hi:inset 0 1px 0 rgba(255,255,255,.075);
}
/* the glow is painted into the page background itself (scrolls with the page): a fixed layer behind
   see-through cards forced the browser to re-composite the whole screen on every scroll frame */
html{background-color:var(--bg);background-repeat:no-repeat;
  background-image:radial-gradient(900px 640px at 6% 0,var(--amb),transparent 70%),radial-gradient(760px 600px at 100% 120px,rgba(139,92,246,.14),transparent 70%)}
body{background:transparent}
.card{--bs-card-bg:transparent;background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-hi)}
@media (hover:hover){.card:hover{border-color:rgba(255,255,255,.16);box-shadow:var(--glass-hi),0 18px 40px -18px rgba(0,0,0,.85),0 0 0 1px rgba(34,211,238,.08)}}
.cert,.hl-item,.filter,.tab-search,.lang,.chip,.qs-ic,.ph-nav button,.ab-btn,.sa:not(.sa-main),.sheet-grid .tab:not(.on),.mb-arrow{
  background:var(--glass-2);border-color:var(--glass-line);box-shadow:var(--glass-hi)}
.story{background:rgba(255,255,255,.025);border-color:var(--glass-line)}
.filter.on{background:linear-gradient(155deg,rgba(34,211,238,.24),rgba(34,211,238,.08));border-color:rgba(34,211,238,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 18px -8px rgba(34,211,238,.6)}
.btn-soft{--bs-btn-bg:transparent;background:var(--glass-2);--bs-btn-border-color:var(--glass-line);box-shadow:var(--glass-hi)}
.btn-cyan{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.ph-ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px -10px rgba(34,211,238,.5)}

/* frosted bars and sheets: real blur only on these few fixed surfaces */
.tabs{background:rgba(16,20,24,.58);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}

.sheet.offcanvas-bottom{--bs-offcanvas-bg:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 -20px 50px -20px rgba(0,0,0,.9)}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabs{background:rgba(16,20,24,.95)} .qs-box,.sheet.offcanvas-bottom{background:#1a2027}
}

/* the cover photo fades out with a mask (to transparent), so it melts into the coloured glow behind it
   instead of ending on a flat dark band. The mask sits on the still photo only — never on the animated
   canvas — so it is drawn once and costs nothing while scrolling. */
.cover{background:transparent}
.cover-img{-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 96%);mask-image:linear-gradient(180deg,#000 50%,transparent 96%)}
.cover::after{background:linear-gradient(180deg,rgba(17,20,23,0) 0%,rgba(17,20,23,.1) 40%,rgba(17,20,23,.45) 75%,rgba(17,20,23,0) 100%)!important}
/* ---- press & slide ---- */
#tabs,#bnav{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  box-shadow:0 6px 24px -4px rgba(34,211,238,.9),0 0 0 4px rgba(34,211,238,.14)}
#tabs.scrubbing .tab.on:not(.hot){color:var(--muted)}
#tabs.scrubbing .tab.hot{color:#06222b}
#tabs .tab{transition:background .15s,color .15s,border-color .15s,transform .2s cubic-bezier(.34,1.56,.64,1)}
#tabs.scrubbing .tab.hot{transform:translateY(-1px) scale(1.04)}
@media (max-width:700px){
  #bnav{touch-action:none}
  .bn-ink{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,#5ee6f7,var(--cyan));box-shadow:0 4px 16px -4px rgba(34,211,238,.85),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .42s cubic-bezier(.34,1.32,.64,1),width .3s ease;will-change:transform}
  .bn-ic{position:relative;z-index:1}
  .bn.on .bn-ic{background:transparent;box-shadow:none}
  #bnav.scrubbing .bn.on:not(.hot){color:var(--muted)}
  #bnav.scrubbing .bn.on:not(.hot) .bn-ic{color:var(--muted)}
  #bnav.scrubbing .bn.hot{color:var(--text)}
  #bnav.scrubbing .bn.hot .bn-ic{color:#06222b}
  #bnav.scrubbing .bn-ink{transition:transform .2s cubic-bezier(.22,.61,.36,1);box-shadow:0 4px 22px -2px rgba(34,211,238,.95),0 0 0 5px rgba(34,211,238,.15)}
  #bnav.scrubbing .bn.hot .bn-ic svg{transform:translateY(-2px) scale(1.12)}
  .bn.on .bn-ic{color:#06222b}
}
/* ---- smoothness ---- */
.is-scrolling main,.is-scrolling .hero{pointer-events:none}

@media print{html{background-image:none!important}}

/* lightbox groups */
const GROUPS={}; let gid=0;
function grp(list){const k="g"+(gid++);GROUPS[k]=list;return k}
/* grids and cards show a light 800px copy from images/thumbs/ (≈⅓ of the pixels to decode, so scrolling
   stays smooth); the lightbox still opens the full-size original. If a thumb is missing, the original loads. */
const TH=src=>String(src).replace(/^images\/(photos|certs)\//,"images/thumbs/$1/");
window.thumbFail=el=>{ el.onerror=null; el.src=el.src.replace("/images/thumbs/","/images/"); };
const img=(src,k,i,alt="")=>`<img src="${TH(src)}" loading="lazy" decoding="async" onerror="thumbFail(this)" alt="${alt}" data-g="${k}" data-i="${i}">`;
function pics(list){const k=grp(list.map(s=>({src:s})));const n=Math.min(list.length,4);return `<div class="pics n${n}">${list.slice(0,4).map((s,i)=>img(s,k,i)).join("")}</div>`}

function post(r){

    ${pics(r.pics)}

}

/* tabs */
let cur=(location.hash||"#home").slice(1); if(!TABS.some(t=>t[0]===cur))cur="home";
let firstGo=true;
const scrollMemory={}, visitedTabs=new Set();
/* .tabs is position:sticky — once the page has scrolled, its offsetTop stops meaning
   "height of the header" and instead reflects wherever it's currently pinned, which is
   basically always ≈ the current scroll position. That made every top/bottom check below
   compare a number against itself. Cache the real header height once, before anything
   has scrolled, and reuse that fixed number everywhere instead of re-reading offsetTop. */
const HEADER_H=document.querySelector(".tabs").offsetTop;
/* top of a page's content: under the sticky tab bar (tablet/desktop), or the section heading just below the top bar (phones) */
function pageTop(){
  if(!matchMedia("(max-width:700px)").matches) return HEADER_H;
  const ph=document.getElementById("phead");
  return Math.max(HEADER_H+1, Math.round(ph.getBoundingClientRect().top+scrollY-56-8));
}
/* go(tab)          — from the menu / swipe: top of a new page, or where you left off
   go(tab, anchor)  — from a "Highlights" link: open that page and jump straight to that item */
function go(t,anchor){
  const prevScroll=window.scrollY; /* capture BEFORE the panel swap */
  if(cur) scrollMemory[cur]=prevScroll;
  const firstVisit=!visitedTabs.has(t);
  const dir=Math.sign(TABS.findIndex(x=>x[0]===t)-TABS.findIndex(x=>x[0]===cur));
  cur=t;
  { const tp=document.getElementById("p-"+t); if(tp) tp.style.setProperty("--dx",(dir*28)+"px"); }
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  moveInk(); /* start the highlight's slide before the (heavier) page swap below */
  document.querySelectorAll(".panel").forEach(p=>{
    const isTarget=p.id==="p-"+t;
    p.classList.toggle("on",isTarget);
    p.classList.remove("show");
    if(isTarget) requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add("show")));
  });
  history.replaceState(null,"","#"+t);
  trackTab(t);
  visitedTabs.add(t);
  /* deferred one frame: mobile browsers often ignore a scrollTo() made synchronously
     inside a touch handler, right when the panel's display just changed */
  if(anchor&&t==="certs"&&certF!=="all"){ certF="all"; renderCerts(); }
  requestAnimationFrame(()=>{
    if(anchor&&scrollToAnchor(t,anchor)){
      /* jumped straight to the item */
    }else if(!firstVisit){
      scrollTo({top:scrollMemory[t]||0,behavior:"auto"});
    }else if(prevScroll>pageTop()){
      scrollTo({top:pageTop(),behavior:"auto"}); /* new page starts at the top, menu in view */
    }
    const fEl=document.querySelector("#p-"+t+" .filters");
    if(fEl) fEl.classList.toggle("at-end",fEl.scrollWidth<=fEl.clientWidth+2);
  });
  { /* keep the active tab in view inside the bar itself, without ever scrolling the page */
    const bar=document.querySelector(".tabs .wrap"), btn=bar&&bar.querySelector(`.tab[data-t="${t}"]`);
    if(bar&&btn&&bar.scrollWidth>bar.clientWidth+2) bar.scrollTo({left:btn.offsetLeft-bar.clientWidth/2+btn.offsetWidth/2,behavior:"smooth"});
  }
  updateMinibar(); closeSheet(); moveInk(); markLoaded(); journeyState(); if(t==="robots") initToc(); if(typeof watchJourney==="function") watchJourney(); watchItems();
  initStlViewers();
  setSwipeHintText();
  stopActiveVideo();
  document.querySelectorAll("#p-projects video").forEach(v=>v.pause());
  observeReveals();
  if(firstGo){firstGo=false;}else{hideSwipeHint();}}

function anchorTop(el){
  const phone=matchMedia("(max-width:700px)").matches;
  const offset=phone?70:document.querySelector(".tabs").offsetHeight+14; /* phones: bar is at the bottom; larger screens: clear the sticky top bar */
  return Math.max(0,el.getBoundingClientRect().top+scrollY-offset);
}
function scrollToAnchor(t,anchor){
  const el=document.querySelector(`#p-${t} [data-anchor="${anchor}"]:not([data-go])`); /* the target itself, never a link that points to it */
  if(!el)return false;
  if(el.classList.contains("reveal")){ revealObserver.unobserve(el); if(window.gsap) gsap.killTweensOf(el);
    el.style.transition="none"; el.classList.add("in","done"); if(window.gsap) gsap.set(el,{clearProps:"opacity,transform"});
    void el.offsetWidth; el.style.transition=""; }
  let y=anchorTop(el); scrollTo({top:y,behavior:"auto"});
  /* the page fades in and images above may still be loading; re-aim once things settle,
     unless the visitor has already started scrolling on their own */
  setTimeout(()=>{ if(Math.abs(scrollY-y)<4){ y=anchorTop(el); scrollTo({top:y,behavior:"smooth"}); } },450);
  el.classList.remove("anchor-flash"); void el.offsetWidth; el.classList.add("anchor-flash");
  return true;
}

    <span class="vid-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>`;

  if(e.target.closest("[data-resume]"))return downloadResume();

/* ---------- STL 3D viewers: ONE shared WebGL renderer, many 2D "screens" ----------
   Why some models turned white on Android: every card used to create its own WebGL
   context (10 of them). Android Chrome keeps only a handful of GPU contexts alive and
   silently kills the oldest when memory gets tight; a killed context shows as a white or
   gray box that never comes back.
   The fix is the standard technique for many 3D views on one page: the whole site has
   exactly ONE WebGL context, kept off-screen. Every card shows an ordinary 2D <canvas>.
   Each frame the shared renderer draws a card's scene and the picture is copied onto that
   card's 2D canvas. 2D canvases are not affected by the WebGL context limit and keep their
   last picture even if the GPU context ever resets, so a card can no longer go white.
   Extra safety: models far off-screen release their GPU memory (re-uploaded automatically
   when they come back), downloads are lazy and queued, a reset context is recovered or
   rebuilt, and nothing renders while a model is off-screen or the tab is hidden. */
const STL={renderer:null,lost:false,w:0,h:0,views:[],geo:new Map(),queue:[],loading:0,raf:0,lostT:0};
const STL_PAR=2;
const STL_TOUCH=matchMedia("(pointer:coarse)").matches;
const STL_DPR=Math.min(window.devicePixelRatio||1, STL_TOUCH?1.5:2);

function stlRenderer(){
  if(STL.renderer) return STL.renderer;
  let r;
  try{ r=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"}); }
  catch(e){ return null; }
  r.setPixelRatio(1); r.setClearColor(0x000000,0);
  r.domElement.addEventListener("webglcontextlost",e=>{
    e.preventDefault(); STL.lost=true;
    clearTimeout(STL.lostT); STL.lostT=setTimeout(stlRebuildRenderer,2500); /* not restored in time → start fresh */
  });
  r.domElement.addEventListener("webglcontextrestored",()=>{
    clearTimeout(STL.lostT); STL.lost=false; STL.w=STL.h=0;
    STL.views.forEach(v=>v.dirty=true); stlKick();
  });
  STL.renderer=r; STL.w=STL.h=0;
  return r;
}
function stlRebuildRenderer(){
  try{ STL.renderer&&STL.renderer.dispose(); }catch(e){}
  STL.renderer=null; STL.lost=false;
  stlRenderer(); STL.views.forEach(v=>v.dirty=true); stlKick();
}

    fail:["โหลดไฟล์ 3D ไม่สำเร็จ แตะเพื่อลองใหม่","Couldn't load the 3D file — tap to retry"],
    nogl:["อุปกรณ์นี้แสดงโมเดล 3D ไม่ได้","This device can't show 3D models"],
    tapIdle:["แตะเพื่อหมุนดูโมเดล","Tap to rotate the model"],
    tapOn:["หมุน / ซูมได้ · แตะนอกกรอบเพื่อเลื่อนหน้า","Rotate / pinch to zoom · tap outside to scroll"],
    mouse:["ลากเพื่อหมุน · คลิกแล้วเลื่อนลูกกลิ้งเพื่อซูม","Drag to rotate · click, then scroll to zoom"]

function stlBuild(v,geo){

function stlGeometry(src,onProgress){

function stlLoad(v){

  stlGeometry(v.src,xhr=>{

function initStlViewers(){
  if(typeof THREE==="undefined"||!THREE.STLLoader||!THREE.OrbitControls)return;

/* sliding highlight behind the active tab (desktop) */
/* The highlight is positioned with a CSS transition rather than a fixed-target tween: whenever the
   tabs shift (e.g. the name slides into the bar after a jump), the next call simply retargets the
   running transition, so the highlight always ends exactly on the active tab. */
function moveInk(target){
  const bar=document.getElementById("tabs"); if(!GS){ bar.classList.remove("has-ink"); return; }
  bar.classList.add("has-ink");
  let ink=bar.querySelector(".tab-ink"), fresh=false;
  if(!ink){ ink=document.createElement("span"); ink.className="tab-ink"; bar.prepend(ink); fresh=true;
    if(inkRO) bar.querySelectorAll(".tab").forEach(t=>inkRO.observe(t)); }
  const on=(target instanceof Element)?target:(bar.querySelector(".tab.hot")||bar.querySelector(".tab.on")); if(!on||on.offsetWidth===0) return;
  if(fresh) ink.style.transition="none";
  ink.style.transform=`translate(${on.offsetLeft}px,${on.offsetTop}px)`;
  ink.style.width=on.offsetWidth+"px"; ink.style.height=on.offsetHeight+"px";
  if(fresh){ void ink.offsetWidth; ink.style.transition=""; }

/* scroll-reveal: fade+rise once, the first time a card/photo/cert enters view */
const revealObserver=new IntersectionObserver(entries=>{
  if(document.documentElement.classList.contains("splash")) return; /* hidden behind the splash: wait, replay once it opens */
  const els=entries.filter(en=>en.isIntersecting).map(en=>en.target);
  if(!els.length)return;
  els.forEach(el=>revealObserver.unobserve(el));
  /* everything that enters together cascades in reading order */
  const pos=el=>{const r=el.getBoundingClientRect();return r.top*10000+r.left};
  els.sort((a,b)=>pos(a)-pos(b));
  els.forEach((el,i)=>{ const d=Math.min(i,10)*70;
    el.style.transitionDelay=d+"ms"; el.classList.add("in");
    const fin=()=>{ if(el.classList.contains("done"))return; el.style.transitionDelay=""; el.classList.add("done"); };
    el.addEventListener("transitionend",e=>{ if(e.target===el&&e.propertyName==="opacity") fin(); },{once:false});
    setTimeout(fin,d+900); });
},{threshold:.12});
/* re-arm reveals that were held back (e.g. under the splash) so they play in view */
function kickReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(el=>{ revealObserver.unobserve(el); revealObserver.observe(el); }); }
setTimeout(kickReveals,4700); /* matches the splash safety-net timer in <head> */
function observeReveals(){
  document.querySelectorAll(
    "#p-home .card, #p-robots .card, #p-projects .card, #p-certs .cert, #p-videos .card, #p-about .card"
    /* #p-design .card is deliberately excluded — animating transform/opacity on the card
       that wraps a live WebGL canvas is what caused the 3D models to flicker */
  ).forEach(el=>{
    if(el.classList.contains("reveal"))return;
    el.classList.add("reveal");
    revealObserver.observe(el);
  });
}

function sendTabTime(){ if(!tabCur)return; const sec=tabSeconds(); tabActive=0; tabT0=performance.now(); if(sec>0) track("section_time",{tab:tabCur,seconds:sec}); }
function trackTab(t){
  if(!TRACK||OWNER||t===tabCur)return;
  sendTabTime(); tabCur=t; tabT0=performance.now(); tabActive=0; depthSent=new Set();
  const title="Portfolio · "+UI[t].en;
  gtag("event","page_view",{page_title:title,page_location:location.href,page_path:location.pathname+"#"+t,nav_via:NAV_VIA,open_in:OPEN_IN,entry_source:ENTRY,lang:L});
  stPush("page_view",{page_title:UI[t].en,nav_via:NAV_VIA,tab:t});
  clarity("set","section",t); NAV_VIA="menu";
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ sendTabTime(); tabPaused=true; } else { tabPaused=false; tabT0=performance.now(); } });
let depthTick=false;
document.addEventListener("scroll",()=>{ if(!TRACK||depthTick)return; depthTick=true; requestAnimationFrame(()=>{ depthTick=false;
  const panel=document.getElementById("p-"+cur); if(!panel)return; const r=panel.getBoundingClientRect(); if(r.height<10)return;
  const seen=Math.min(1,Math.max(0,(innerHeight-r.top)/r.height));
  for(const d of [25,50,75,100]) if(seen*100>=d-1&&!depthSent.has(d)){ depthSent.add(d); track("scroll_depth",{percent_scrolled:d}); } }); },{passive:true});
/* each competition post / project / 3D model / video that someone actually stops on (half visible for 1 s) */
const itemSeen=new Set(), itemTimers=new Map();
const itemIO=new IntersectionObserver(es=>es.forEach(en=>{ const el=en.target, name=el.dataset.item; if(!name||itemSeen.has(name))return;
  if(en.isIntersecting&&!document.documentElement.classList.contains("splash")) itemTimers.set(el,setTimeout(()=>{ itemSeen.add(name); itemIO.unobserve(el); track("item_view",{item_name:name}); },1000));
  else { clearTimeout(itemTimers.get(el)); itemTimers.delete(el); } }),{threshold:.5});
function watchItems(){ if(TRACK) document.querySelectorAll("[data-item]").forEach(el=>{ if(!itemSeen.has(el.dataset.item)) itemIO.observe(el); }); }
/* what gets clicked — runs before the normal click handling, and labels how a section was reached */
const itemOf=el=>{ const i=el.closest("[data-item]"); return i?i.dataset.item:"(none)"; };
const where=el=>el.closest("header")?"header":el.closest("footer")?"footer":el.closest(".card")?"card":"page";
document.addEventListener("click",e=>{
  const el=e.target;
  if(el.closest(".tabs .tab")) NAV_VIA="menu";
  else if(el.closest(".sheet-grid")) NAV_VIA="section_picker";
  else if(el.closest(".mb-arrow")) NAV_VIA="bottom_arrows";
  else if(el.closest(".bn")) NAV_VIA="bottom_nav";
  else if(el.closest(".ph-nav")) NAV_VIA="section_arrows";
  else if(el.closest(".hl-item")) NAV_VIA="highlights";
  else if(el.closest(".j-item")) NAV_VIA="timeline";
  else if(el.closest(".toc")) NAV_VIA="contents";
  else if(el.closest("[data-go]")) NAV_VIA="link";
  let x;
  if((x=el.closest("[data-resume]"))) track("resume_download",{link_location:where(x)});
  else if((x=el.closest('a[href^="mailto:"]'))) track("contact_email",{link_location:where(x)});
  else if((x=el.closest('a[href*="instagram.com"]'))) track("social_click",{network:"instagram"});
  else if((x=el.closest('a[href*="facebook.com"]'))) track("social_click",{network:"facebook"});
  else if((x=el.closest(".pdf-btn"))) track("report_open",{item_name:itemOf(x)});
  else if((x=el.closest(".hl-item"))) track("highlight_click",{item_name:x.dataset.name,target:x.dataset.anchor});
  else if((x=el.closest(".j-item button"))) track("timeline_click",{item_name:x.dataset.name,target:x.dataset.anchor});
  else if((x=el.closest(".toc [data-anchor]"))) track("contents_click",{target:x.dataset.anchor});
  else if((x=el.closest(".j-arrow"))) track("timeline_arrow",{direction:x.classList.contains("l")?"left":"right"});
  else if((x=el.closest(".vid-poster"))) track("video_play",{item_name:itemOf(x)});
  else if((x=el.closest("[data-f]"))) track("cert_filter",{filter:x.dataset.f});
  else if((x=el.closest(".lang button"))) track("language_switch",{to:x.dataset.l});
  else if((x=el.closest("#mbCur"))) track("section_picker_open");
  else if((x=el.closest("#brand"))) track("brand_click");
  else if((x=el.closest("[data-g]"))){ const im=x.tagName==="IMG"?x:x.querySelector("img");
    track("image_open",{item_name:x.dataset.name||(x.closest("#p-photos")?"Photos gallery":itemOf(x)),image:(im&&im.getAttribute("src")||"").split("/").pop()}); }
},true);

async function loadStats(key){
  const box=document.getElementById("stats"); if(!box)return;

  try{
    const r=await fetch(STATS_URL+(STATS_URL.includes("?")?"&":"?")+"key="+encodeURIComponent(key),{cache:"no-store"}); const d=await r.json();
    if(d.error){ try{ localStorage.removeItem("tk_dash_key"); }catch(e){} return loginForm("รหัสผ่านไม่ถูกต้อง"); }
    try{ localStorage.setItem("tk_dash_key",key); localStorage.setItem("tk_notrack","1"); }catch(e){}
    OWNER=true; stQ.length=0; /* this device is yours: stop counting it from now on */
    const H=d.head; stData=d.rows.map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]]))).map(o=>(o.time=+o.time,o)).sort((a,b)=>a.time-b.time);

  }catch(e){ box.innerHTML=`<div class="st-in"><div class="st-login"><p>โหลดสถิติไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองใหม่</p><button id="stRetry">ลองใหม่</button><button id="stClose">ปิด</button></div></div>`;

}
function renderStats(range){

  const uniq=new Set(V.map(v=>v.visitor)).size, avg=V.length?V.reduce((a,v)=>a+v.dur,0)/V.length:0;

   </div>

   ${V.slice(0,200).map(v=>`<details class="st-visit"><summary><b>${fmtTime(v.first)}</b> · ${esc(SRC_TH[v.src]||v.src)} · ${esc(v.dev)} ${esc(v.os)} · ${esc(v.br)} · <b>${fmtDur(v.dur)}</b>${v.nth>1?` · <span style="color:#f5c451">กลับมาครั้งที่ ${v.nth}</span>`:""}

       ${v.acts.filter(a=>["resume_download","contact_email","social_click","report_open"].includes(a.event)).map(a=>`<span class="g">${esc(EV_TH[a.event])}</span>`).join("")}

  </div>`;
  const q=id=>box.querySelector(id);
  q("#stRange").value=range; q("#stRange").onchange=e=>renderStats(e.target.value);
  q("#stRefresh").onclick=()=>{ let k=""; try{ k=localStorage.getItem("tk_dash_key")||""; }catch(e){} loadStats(k); };
  q("#stOut").onclick=()=>{ try{ localStorage.removeItem("tk_dash_key"); }catch(e){} loginForm(""); };

/* =====================================================================
   PRESS & SLIDE — hold a tab (or the phone's bottom bar) and slide to pick a section,
   like the segmented controls in iOS. A normal tap/click still works exactly as before.
   ===================================================================== */
function scrubber(box,itemSel,{onHot,onPick,onEnd}){
  let st=null, swallow=false;
  const itemAt=x=>{ let best=null,bd=1e9;
    box.querySelectorAll(itemSel).forEach(el=>{ const r=el.getBoundingClientRect(); if(!r.width)return;
      const d=x<r.left?r.left-x:x>r.right?x-r.right:0; if(d<bd){bd=d;best=el;} }); return best; };
  const setHot=(el,first)=>{ if(!el||(!first&&el===st.hot))return;
    if(st.hot) st.hot.classList.remove("hot"); st.hot=el; el.classList.add("hot"); onHot(el);
    if(!first&&navigator.vibrate&&st.type!=="mouse"){ try{navigator.vibrate(7);}catch(_){} } };
  const start=()=>{ if(!st||st.on)return; st.on=true; box.classList.add("scrubbing");
    try{ box.setPointerCapture(st.id); }catch(_){} setHot(st.hot,true); };
  box.addEventListener("pointerdown",e=>{ if(e.button>0)return; const it=e.target.closest(itemSel); if(!it||!box.contains(it))return;
    st={id:e.pointerId,x:e.clientX,y:e.clientY,on:false,hot:null,type:e.pointerType};
    st.first=it; st.t=setTimeout(()=>{ if(st&&!st.on){ st.hot=st.first; start(); } },e.pointerType==="mouse"?280:230); });
  box.addEventListener("pointermove",e=>{ if(!st||e.pointerId!==st.id)return; const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.on){ if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*1.2){ clearTimeout(st.t); st.hot=st.first; start(); }
      else if(Math.abs(dy)>12){ clearTimeout(st.t); st=null; } return; }
    setHot(itemAt(e.clientX)); });
  const end=(e,cancel)=>{ if(!st||e.pointerId!==st.id)return; clearTimeout(st.t); const s=st; st=null; if(!s.on)return;
    box.classList.remove("scrubbing"); if(s.hot) s.hot.classList.remove("hot");
    swallow=true; setTimeout(()=>{swallow=false;},400);
    if(cancel||!s.hot) onEnd(); else onPick(s.hot); };
  box.addEventListener("pointerup",e=>end(e,false));
  box.addEventListener("pointercancel",e=>end(e,true));
  /* touch pointers start captured by the tapped icon; moving that capture to the bar fires a
     lostpointercapture on the icon first, which must not end the slide */
  box.addEventListener("lostpointercapture",e=>{ if(e.target===box&&st&&st.on&&e.pointerId===st.id) end(e,false); });
  box.addEventListener("click",e=>{ if(swallow){ e.stopPropagation(); e.preventDefault(); swallow=false; } },true);
  box.addEventListener("contextmenu",e=>{ if(box.classList.contains("scrubbing")||e.target.closest(itemSel)) e.preventDefault(); });
}

  onEnd:()=>moveInk()
});
/* phone bottom bar: the pill slides under your thumb, a tiny buzz on each section (Android) */
scrubber(document.getElementById("bnav"),".bn",{
  onHot:el=>bnInk(el),
  onPick:el=>{ NAV_VIA="press_slide"; if(el.id==="bnMore"){ bnInk(document.querySelector("#bnav .bn.on")); openSheet(); } else if(el.dataset.t===cur) syncBnav(); else go(el.dataset.t); },
  onEnd:()=>syncBnav()
});

/* each section tints the glow behind the glass a little differently */
var AMB={home:"rgba(34,211,238,.26)",robots:"rgba(245,196,81,.2)",projects:"rgba(167,139,250,.24)",design:"rgba(45,212,191,.22)",
  certs:"rgba(245,196,81,.2)",photos:"rgba(244,114,182,.2)",videos:"rgba(248,113,113,.19)",about:"rgba(56,189,248,.24)"};

/* =====================================================================
   QUICK SEARCH — every robot, project, 3D model, certificate and video in one box
   open: the search button in the bar · the 🔍 in the phone top bar or the section sheet
   ===================================================================== */
const QS_SEL="#p-robots .post,#p-projects article.card,#p-design article.card,#p-videos .card,#p-certs .cert,#p-about .card";
let qsItems=[], qsSel=0, qsShown=[];
const qsEl=document.getElementById("qs"), qsIn=document.getElementById("qsIn"), qsList=document.getElementById("qsList");
const qsNorm=x=>(x||"").toLowerCase().replace(/\s+/g," ").trim();
const qsEsc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function qsIndex(){
  if(certF!=="all"){ certF="all"; renderCerts(); } /* search always sees every certificate */
  qsItems=[...document.querySelectorAll(QS_SEL)].map(el=>{
    const tab=el.closest(".panel").id.slice(2);
    const pickSel=el.classList.contains("post")?[".tag-medal"]:["h3",".t b","h2",".tag-medal","b"];
    let tEl=null; for(const q of pickSel){ tEl=el.querySelector(q); if(tEl)break; }
    const title=(tEl?tEl.textContent:"").replace(/\s+/g," ").trim()||T(UI[tab]);
    const sub=(el.querySelector(".post-head small,.t span")||{}).textContent||"";
    return {el,tab,title,sub:sub.trim(),hay:qsNorm(el.textContent+" "+(el.dataset.item||el.dataset.name||""))};
  }).filter(x=>x.title);
}
function qsMark(text,terms){
  let h=qsEsc(text);
  terms.forEach(t=>{ if(!t)return; const i=h.toLowerCase().indexOf(qsEsc(t).toLowerCase()); if(i>-1) h=h.slice(0,i)+"<mark>"+h.slice(i,i+qsEsc(t).length)+"</mark>"+h.slice(i+qsEsc(t).length); });
  return h;
}
function qsRender(){
  const q=qsNorm(qsIn.value), terms=q.split(" ").filter(Boolean);
  if(!terms.length){ /* nothing typed yet: jump straight to a section */
    qsShown=TABS.map(([k])=>({tab:k,title:T(UI[k]),sub:"",section:true}));
  }else{
    qsShown=qsItems.filter(x=>terms.every(t=>x.hay.includes(t)))
      .map(x=>({...x,score:terms.reduce((a,t)=>a+(qsNorm(x.title).includes(t)?2:0),0)}))
      .sort((a,b)=>b.score-a.score).slice(0,40);
  }
  qsSel=0;
  const head=terms.length?`<div class="qs-h">${qsShown.length?(L==="th"?`พบ ${qsShown.length} รายการ`:`${qsShown.length} result${qsShown.length>1?"s":""}`):""}</div>`:`<div class="qs-h">${L==="th"?"ไปที่หมวด":"Go to section"}</div>`;
  qsList.innerHTML=head+(qsShown.length?qsShown.map((x,i)=>`<button class="qs-it ${i===0?"on":""}" data-qi="${i}" role="option"><span class="qs-ic">${tabIc[x.tab]}</span>
      <span class="qs-tx"><b>${x.section?qsEsc(x.title):qsMark(x.title,terms)}</b>${x.section?"":`<small>${qsEsc(T(UI[x.tab]))}${x.sub?" · "+qsEsc(x.sub):""}</small>`}</span>
      <svg class="qs-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>`).join("")
    :`<div class="qs-empty">${L==="th"?"ไม่พบผลลัพธ์ — ลองคำอื่น เช่น WRG, AI, ESP32, ชนะเลิศ":"No results — try e.g. WRG, AI, ESP32, champion"}</div>`);
}
function qsMove(d){ const its=qsList.querySelectorAll(".qs-it"); if(!its.length)return;
  qsSel=(qsSel+d+its.length)%its.length; its.forEach((b,i)=>b.classList.toggle("on",i===qsSel)); its[qsSel].scrollIntoView({block:"nearest"}); }
function qsPick(i){
  const x=qsShown[i]; if(!x)return;
  const q=qsIn.value.trim(); closeSearch();
  if(q) track("search",{search_term:q.slice(0,90),item_name:x.section?("Section: "+x.tab):(x.el.dataset.item||x.el.dataset.name||x.title).slice(0,90)});
  NAV_VIA="search";
  if(x.section){ go(x.tab); return; }
  if(x.tab==="certs"){ go("certs"); requestAnimationFrame(()=>{ const el=x.el.isConnected?x.el:null; if(!el)return;
      scrollTo({top:anchorTop(el),behavior:"auto"}); openLB(el.dataset.g,+el.dataset.i); }); return; }
  const a="q-"+i+"-"+Date.now(); x.el.setAttribute("data-anchor",a); go(x.tab,a);
}
let qsPrevFocus=null;
function openSearch(){
  if(!qsEl)return; closeSheet(); qsPrevFocus=document.activeElement;
  qsIndex(); qsIn.value=""; qsIn.placeholder=L==="th"?"ค้นหาผลงาน รางวัล โครงงาน เกียรติบัตร…":"Search robots, awards, projects, certificates…";
  document.getElementById("qsClose").textContent=L==="th"?"ปิด":"Close";
  qsRender(); qsEl.classList.add("open"); qsEl.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden";
  setTimeout(()=>qsIn.focus(),30);
}
function closeSearch(){ if(!qsEl.classList.contains("open"))return; qsEl.classList.remove("open"); qsEl.setAttribute("aria-hidden","true"); document.body.style.overflow="";
  if(qsPrevFocus&&qsPrevFocus.focus) qsPrevFocus.focus({preventScroll:true}); }
qsIn.addEventListener("input",qsRender);
qsIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();qsMove(1);} else if(e.key==="ArrowUp"){e.preventDefault();qsMove(-1);}
  else if(e.key==="Enter"){e.preventDefault();qsPick(qsSel);} else if(e.key==="Escape"){closeSearch();} });
qsList.addEventListener("click",e=>{ const b=e.target.closest("[data-qi]"); if(b) qsPick(+b.dataset.qi); });
qsEl.addEventListener("click",e=>{ if(e.target===qsEl||e.target.closest("#qsClose")) closeSearch(); });
document.addEventListener("click",e=>{ if(e.target.closest("[data-search]")) openSearch(); });

/* keyboard: ← → switch section (tablet/desktop) · "/" also opens search */
addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""))||e.target.isContentEditable;
  const modal=qsEl.classList.contains("open")||lb.classList.contains("open")||document.getElementById("stats")&&document.getElementById("stats").offsetParent!==null||document.querySelector(".offcanvas.show");
  if(typing||modal||e.altKey||e.ctrlKey||e.metaKey) return;
  if(e.key==="/"){ e.preventDefault(); openSearch(); return; }
  if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&!e.target.closest(".j-track,.stl-viewer,video")){
    const i=TABS.findIndex(x=>x[0]===cur)+(e.key==="ArrowRight"?1:-1);
    if(i>=0&&i<TABS.length){ NAV_VIA="keyboard"; go(TABS[i][0]); }
  }
});

/* share this portfolio (phones: the system share sheet — LINE, Messenger…; elsewhere: copy the link) */
const SHARE_URL="https://taweesinkinrat-droid.github.io/taweesin-portfolio-/?utm_source=share&utm_medium=share&utm_campaign=portfolio#home";
let toastT=0;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
document.addEventListener("click",async e=>{
  if(!e.target.closest("[data-share]"))return;
  track("share",{method:navigator.share?"native":"copy"});
  if(navigator.share){ try{ await navigator.share({title:T(ME.name)+" — Portfolio",url:SHARE_URL}); }catch(err){} return; }
  try{ await navigator.clipboard.writeText(SHARE_URL); toast(L==="th"?"คัดลอกลิงก์แล้ว":"Link copied"); }
  catch(err){ window.prompt(L==="th"?"คัดลอกลิงก์นี้":"Copy this link",SHARE_URL); }
});

render();go(cur);
observeReveals();
runSplash();
initCoverFx();
initAmbient();
window.__siteReady=true; /* last line of the file: if this never runs, the file was cut off */
</script>
