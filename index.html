</script>
<style>
/* =====================================================================
   THEME — Bootstrap 5 (dark) mapped onto our own palette
   ===================================================================== */
:root,[data-bs-theme=dark]{
  --bg:#111417; --card:#1a1f25; --card-2:#222931; --line:#2c353e; --line-2:#3a4651;
  --text:#e8edf1; --muted:#95a3ae; --cyan:#22d3ee; --cyan-2:#67e8f9; --cyan-soft:rgba(34,211,238,.12);
  --gold:#f5c451; --silver:#cbd5dc; --bronze:#d99a62;
  --r:16px; --pad:20px;

  --bs-body-bg:var(--bg); --bs-body-color:var(--text); --bs-secondary-color:var(--muted);
  --bs-body-font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bs-body-line-height:1.65; --bs-border-color:var(--line);
  --bs-link-color:var(--cyan); --bs-link-color-rgb:34,211,238; --bs-link-hover-color:var(--cyan-2); --bs-link-hover-color-rgb:103,232,249;
  --bs-emphasis-color:#fff; --bs-heading-color:inherit; --bs-focus-ring-color:rgba(34,211,238,.35);
}
/* A fixed root size: browsers with a bigger default font (Samsung Internet, "large text"
   settings, some in-app browsers) no longer blow the whole layout up. Pinch-zoom still works. */
html{font-size:15px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Bootstrap turns on page-wide smooth scrolling; our tab/scroll-memory logic needs instant jumps */
:root{scroll-behavior:auto!important}
@media (min-width:768px){html{font-size:16px}}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
a:hover{color:var(--cyan-2)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
::selection{background:rgba(34,211,238,.3)}
.muted{color:var(--muted)}
.container-xl{--bs-gutter-x:2rem}
@media (min-width:1400px){.container-xl{max-width:1240px}}

/* buttons — Bootstrap .btn with our colour variants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border-radius:12px;
  --bs-btn-padding-x:1.1rem;--bs-btn-padding-y:.55rem;--bs-btn-font-size:.95rem;transition:transform .15s ease,background-color .15s,border-color .15s,color .15s}
.btn:active{transform:scale(.96)}
.btn-cyan{--bs-btn-color:#06222b;--bs-btn-bg:var(--cyan);--bs-btn-border-color:var(--cyan);
  --bs-btn-hover-color:#06222b;--bs-btn-hover-bg:var(--cyan-2);--bs-btn-hover-border-color:var(--cyan-2);
  --bs-btn-active-color:#06222b;--bs-btn-active-bg:var(--cyan-2);--bs-btn-active-border-color:var(--cyan-2);
  box-shadow:0 6px 20px -8px rgba(34,211,238,.7)}
.btn-soft{--bs-btn-color:var(--text);--bs-btn-bg:var(--card-2);--bs-btn-border-color:var(--line);
  --bs-btn-hover-color:var(--cyan);--bs-btn-hover-bg:var(--card-2);--bs-btn-hover-border-color:var(--cyan);
  --bs-btn-active-color:var(--cyan);--bs-btn-active-bg:var(--card-2);--bs-btn-active-border-color:var(--cyan)}
.btn svg{width:18px;height:18px;flex:0 0 18px}

/* =====================================================================
   HERO / PROFILE HEADER
   ===================================================================== */
.hero{position:relative}
.cover{position:relative;overflow:hidden;height:clamp(150px,30vw,340px);border-radius:0 0 var(--r) var(--r);background:#0f2a33}
.cover-img{position:absolute;inset:-46px 0 0 0;background:url("images/photos/wrg-team.jpg") center 30%/cover;will-change:transform}
.cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(17,20,23,0) 0%,rgba(17,20,23,.12) 40%,rgba(17,20,23,.7) 76%,var(--bg) 100%)}
/* wide screens: the photo's left/right edges dissolve into the page instead of ending in hard lines */
@media (min-width:1200px){.cover{border-radius:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}}
@media (max-width:575.98px){.hero .container-xl{padding-left:0;padding-right:0}.cover{border-radius:0}}

/* phones: avatar left + actions right on one line, text below (compact, like a pro profile page)
   tablet/desktop: avatar · name · actions side by side */
.head{position:relative;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"av act" "who who";align-items:end;column-gap:14px;margin-top:-46px;padding:0 16px}
.avatar{grid-area:av;width:96px;height:96px;border-radius:50%;border:4px solid var(--bg);background:#223 center/cover;
  box-shadow:0 0 0 2px var(--cyan),0 0 28px -6px rgba(34,211,238,.65);animation:avatarGlow 4.5s ease-in-out infinite}
@keyframes avatarGlow{0%,100%{box-shadow:0 0 0 2px var(--cyan),0 0 28px -6px rgba(34,211,238,.6)}50%{box-shadow:0 0 0 2px var(--cyan),0 0 40px -4px rgba(34,211,238,.85)}}
.head-actions{grid-area:act;justify-self:end;display:flex;align-items:center;gap:8px;padding-bottom:6px}
.head-actions .btn{white-space:nowrap}
@media (max-width:359.98px){.avatar{width:82px;height:82px}.head{margin-top:-40px;column-gap:10px}.lang button{padding:6px 9px}}
.who{grid-area:who;min-width:0;margin-top:12px}
.who h1{font-size:clamp(1.55rem,1.1rem + 1.6vw,2.35rem);font-weight:700;line-height:1.2;letter-spacing:-.005em}
.who .sub{color:#b4c1cb;font-size:.95rem;line-height:1.55;margin-top:4px;max-width:72ch}
/* tablet/desktop: avatar, name and actions sit together on ONE level inside a glass profile card
   that overlaps the bottom of the cover photo */
@media (min-width:768px){
  .hero .container-xl{padding-left:calc(var(--bs-gutter-x)*.5);padding-right:calc(var(--bs-gutter-x)*.5)}
  .head{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"av who" "av act";align-items:center;column-gap:26px;row-gap:14px;
    margin:-78px 24px 0;padding:0}
  .who h1,.who .sub{text-shadow:0 2px 16px rgba(0,0,0,.75)}
  .avatar{width:124px;height:124px;border:4px solid var(--bg)}
  .who{margin-top:0;align-self:end}
  .head-actions{justify-self:start;align-self:start;padding:0}
}
@media (min-width:992px){
  .head{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av who act";column-gap:30px;margin-top:-92px}
  .who{align-self:center}
  .head-actions{justify-self:end;align-self:center}
}
@media (min-width:1200px){.head{margin:-104px 40px 0}.avatar{width:144px;height:144px}}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;line-height:1.3;padding:4px 11px;border-radius:999px;
  background:rgba(27,32,38,.9);border:1px solid var(--line);color:#d5dee5}
.pill.top{font-size:.9rem;font-weight:700;padding:6px 14px;color:var(--gold);border-color:rgba(245,196,81,.6);
  background:linear-gradient(135deg,rgba(245,196,81,.2),rgba(30,24,10,.9));box-shadow:0 4px 18px -6px rgba(245,196,81,.45)}
.pill-break{flex-basis:100%;height:0}
.flag{width:1.35em;height:.9em;flex:0 0 auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.lang{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{padding:6px 11px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--muted);line-height:1.2}
.lang button.on{background:var(--cyan);color:#06222b}
@media (max-width:575.98px){.head-actions .btn{--bs-btn-padding-x:.9rem;--bs-btn-padding-y:.45rem;--bs-btn-font-size:.9rem}}

/* =====================================================================
   SECTION NAV — sticky pill bar (tablet/desktop) · 4×2 tile grid + bottom bar (phones)
   ===================================================================== */
.tabs{position:sticky;top:0;z-index:20;margin-top:18px;padding:10px 0;
  background:rgba(17,20,23,.86);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line)}
.tabs-in{display:flex;align-items:center;gap:12px}
.brand{display:none}
.tabs .wrap{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
@media (min-width:1200px){
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;padding:4px;margin-left:-4px;
    font-weight:700;font-size:.95rem;color:var(--text);transition:max-width .35s ease,opacity .25s ease}
  .brand i{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#223 center/cover;border:2px solid var(--cyan);box-shadow:0 0 12px -3px rgba(34,211,238,.7)}
  body.scrolled .brand{max-width:260px;opacity:1}
  .tabs .wrap{justify-content:flex-end}
  body:not(.scrolled) .tabs .wrap{justify-content:center}
}
.tab{white-space:nowrap;padding:9px 15px;font-weight:600;font-size:.92rem;color:var(--muted);
  display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s}
.tab svg{width:18px;height:18px;flex:0 0 18px}
@media (hover:hover){.tab:hover{color:var(--text);background:var(--card)}}
.tab:active{transform:scale(.95)}
.tab.on{color:#06222b;background:var(--cyan);border-color:var(--cyan);box-shadow:0 4px 16px -4px rgba(34,211,238,.7)}
@media (max-width:700px){
  .tabs{position:static;margin-top:16px;padding:0 0 4px;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabs .container-xl{--bs-gutter-x:1.5rem}
  .tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible}
  .tab{flex-direction:column;justify-content:center;gap:4px;padding:8px 2px;min-height:56px;border-radius:12px;
    font-size:.72rem;line-height:1.2;white-space:normal;text-align:center;background:var(--card);border-color:var(--line)}
  .tab svg{width:19px;height:19px;flex:0 0 19px}
}
@media (min-width:701px) and (max-width:991.98px){
  .tabs .wrap{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;overflow:visible}
  .tab{flex-direction:column;justify-content:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:.74rem;line-height:1.2;white-space:normal;text-align:center}
}
/* phones: slim bottom bar once the tile grid has scrolled away */
.minibar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:none;align-items:center;gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(17,20,23,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);box-shadow:0 -8px 22px -12px rgba(0,0,0,.85);
  transform:translateY(110%);transition:transform .25s cubic-bezier(.22,.61,.36,1)}
@media (max-width:700px){
  .minibar{display:flex}
  body.mb-on .to-top{bottom:calc(76px + env(safe-area-inset-bottom))}
  footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
.minibar.show{transform:none}
.mb-arrow{width:44px;height:42px;flex:0 0 44px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.mb-arrow svg{width:20px;height:20px}
.mb-arrow:disabled{opacity:.3}
.mb-cur{flex:1;min-width:0;height:42px;border-radius:11px;background:var(--cyan);color:#06222b;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.mb-cur svg{width:18px;height:18px;flex:0 0 18px}
.mb-cur .mb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-cur .mb-count{font-weight:600;font-size:.78rem;opacity:.65}
/* section picker — Bootstrap offcanvas (bottom) */
.sheet.offcanvas-bottom{--bs-offcanvas-height:auto;--bs-offcanvas-bg:var(--card);--bs-offcanvas-border-color:var(--line);
  border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.sheet-handle{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:10px auto 0}
.sheet .offcanvas-header{padding:10px 16px 6px}
.sheet-title{font-weight:700;font-size:.95rem;color:var(--muted)}
.sheet .offcanvas-body{padding:6px 12px 16px}
.sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sheet-grid .tab{flex-direction:column;justify-content:center;gap:4px;padding:10px 2px;min-height:62px;border-radius:12px;
  font-size:.74rem;line-height:1.2;white-space:normal;text-align:center}
.sheet-grid .tab:not(.on){background:var(--card-2);border-color:var(--line)}
.swipe-hint{text-align:center;font-size:.78rem;color:var(--muted);padding:6px 16px 0;transition:opacity .4s ease;
  display:flex;align-items:center;justify-content:center;gap:6px}
.swipe-hint.hide{opacity:0;height:0;padding:0;overflow:hidden}
.swipe-hint svg{width:14px;height:14px}

/* =====================================================================
   PAGES & CARDS
   ===================================================================== */
main{padding-top:20px;padding-bottom:56px}
@media (min-width:768px){main{padding-top:28px}}
.panel{display:none}
.panel.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stack>*+*{margin-top:16px}
@media (min-width:992px){.stack>*+*{margin-top:20px}}

/* our cards ride on Bootstrap's .card but keep a simple block flow */
.card{display:block;--bs-card-bg:var(--card);--bs-card-border-color:var(--line);--bs-card-border-radius:var(--r);
  padding:var(--pad);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
@media (max-width:575.98px){:root{--pad:16px;--r:14px}}
@media (hover:hover){.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}}
/* the 3D viewer cards must never have their transform animated — that made WebGL canvases flicker */
#p-design .card,#p-design .card:hover,#p-design .card:active{transform:none!important;transition:none!important}
.card h2{font-size:1.12rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:4px;height:1.05em;border-radius:3px;background:var(--cyan);flex:0 0 4px}
.card h3{font-size:1.06rem;font-weight:700;line-height:1.4}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{margin:0}
.link-more{font-size:.88rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.link-more:hover{color:var(--cyan)}
.link-more svg{width:16px;height:16px}
.media-top{margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 16px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.media-top img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
@media (min-width:992px){.sticky-lg{position:sticky;top:96px}}
.lead-note{color:var(--muted);margin-bottom:16px;max-width:75ch}

/* intro list */
.info{list-style:none;display:grid;gap:11px}
.info li{display:flex;gap:11px;align-items:flex-start;min-width:0}
.info li>span,.info li>a{min-width:0;overflow-wrap:anywhere}
.info svg{width:20px;height:20px;flex:0 0 20px;color:var(--muted);margin-top:3px}
.info a{background-image:linear-gradient(var(--cyan),var(--cyan));background-size:0% 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s ease}
.info a:hover{background-size:100% 1px}

/* highlights */
.hl-list{list-style:none;display:grid;gap:8px}
.hl-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-align:left;
  background:var(--card-2);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.hl-item:active{transform:scale(.985)}
@media (hover:hover){.hl-item:hover{border-color:rgba(34,211,238,.5)}.hl-item:hover .hl-go{transform:translateX(3px);color:var(--cyan)}}
.hl-ico{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;font-size:1.15rem;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25)}
.hl-ico.gold{background:rgba(245,196,81,.1);border-color:rgba(245,196,81,.35)}
.hl-txt{flex:1;min-width:0}
.hl-txt b{display:block;font-size:.95rem;line-height:1.35}
.hl-txt span{display:block;color:var(--muted);font-size:.82rem;line-height:1.4;margin-top:2px}
.hl-go{flex:0 0 18px;width:18px;height:18px;color:var(--muted);transition:transform .15s,color .15s}
.anchor-flash{animation:anchorFlash 1.8s ease-out}
@keyframes anchorFlash{0%,35%{box-shadow:0 0 0 2px var(--cyan),0 0 26px -4px rgba(34,211,238,.7)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}

/* small photo grid */
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden}
.mini-grid img{aspect-ratio:1;object-fit:cover;width:100%;cursor:zoom-in}

/* competition posts */
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.post-head .av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:center/cover;box-shadow:0 0 0 1.5px var(--line-2)}
.post-head b{display:block;line-height:1.25;font-size:.95rem}
.post-head small{color:var(--muted);font-size:.8rem}
.post p{margin-bottom:10px}
.tag-medal{display:inline-flex;gap:6px;align-items:flex-start;font-size:.84rem;font-weight:600;line-height:1.45;padding:5px 12px;border-radius:12px;margin-bottom:10px;max-width:100%}
.m-gold{color:var(--gold);background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.4)}
.m-cyan{color:var(--cyan);background:var(--cyan-soft);border:1px solid rgba(34,211,238,.4)}
.story{display:grid;margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card-2)}
.story .srow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.story .srow:first-child{border-top:0}
.story .srow b{font-size:.76rem;font-weight:700;color:var(--cyan);letter-spacing:.03em;padding-top:2px}
.story .srow span{font-size:.94rem;line-height:1.6;color:#dbe4ea}
.story .srow.result{background:rgba(245,196,81,.06)}
.story .srow.result b{color:var(--gold)}
.story .srow.result span{color:#f3e2b5;font-weight:600}
@media (max-width:520px){.story .srow{grid-template-columns:1fr;gap:2px;padding:10px 12px}}
.pics{display:grid;gap:4px;border-radius:12px;overflow:hidden;margin-top:6px}
.pics.n1{grid-template-columns:1fr}
.pics.n2{grid-template-columns:1fr 1fr}
.pics.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.pics.n3 img:first-child{grid-row:1/3}
.pics.n4{grid-template-columns:1fr 1fr}
.pics img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;cursor:zoom-in;background:var(--card-2)}
.pics.n3 img:first-child{aspect-ratio:auto}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:.8rem;padding:3px 10px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);color:#c9d4db}

/* certificate filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.filters.at-end{-webkit-mask-image:none;mask-image:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:.9rem;transition:transform .15s ease,border-color .15s ease}
.filter:active{transform:scale(.95)}
.filter.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.filter .n{opacity:.7;margin-left:5px;font-size:.78rem}

/* certificates */
.cert{height:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:border-color .2s,transform .2s ease,box-shadow .2s ease}
@media (hover:hover){.cert:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}}
.cert:active{transform:scale(.97)}
.cert img{width:100%;aspect-ratio:1.414;object-fit:cover;object-position:top;background:#fff}
.cert .t{padding:10px 12px}
.cert .t b{display:block;font-size:.9rem;line-height:1.4;font-weight:600}
.cert .t span{font-size:.78rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
@media (max-width:575.98px){.cert .t{padding:8px 10px}.cert .t b{font-size:.82rem}}

/* photos */
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
@media (max-width:575.98px){.photo-grid img{border-radius:6px}}

/* projects / 3D */
.proj-video{aspect-ratio:16/9;border-radius:var(--r) var(--r) 0 0;overflow:hidden;margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 16px;background:#000}
.proj-video video{width:100%;height:100%;display:block;object-fit:cover}
.pdf-btn{margin-top:12px}
.proj-team{font-size:.88rem;margin:6px 0;color:#c9d4db}
.proj-team b{color:var(--cyan);font-weight:700}
.proj-result{font-size:.94rem;margin:8px 0;color:var(--gold);font-weight:600}
.bp{aspect-ratio:16/9;display:grid;place-items:center;color:var(--cyan);
  background:linear-gradient(rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(34,211,238,.07) 1px,transparent 1px) 0 0/16px 16px,#13212a}
.bp svg{width:46%;height:70%}
.stl-viewer{position:relative;aspect-ratio:16/10;overflow:hidden;touch-action:pan-y;
  background:radial-gradient(ellipse at 50% 60%,#14262e 0%,#0d1519 70%);transition:box-shadow .2s}
.stl-viewer canvas{display:block;width:100%;height:100%}
.stl-viewer.active{touch-action:none;box-shadow:inset 0 0 0 2px var(--cyan)}
.stl-hint{position:absolute;left:10px;bottom:10px;z-index:2;max-width:calc(100% - 20px);font-size:.74rem;line-height:1.3;
  padding:5px 10px;border-radius:999px;background:rgba(10,16,20,.8);border:1px solid var(--line);color:#cfe3ea;
  pointer-events:none;transition:opacity .35s,border-color .2s,color .2s}
.stl-viewer.active .stl-hint{border-color:rgba(34,211,238,.55);color:var(--cyan)}
@media (hover:hover){.stl-viewer.used .stl-hint{opacity:0}}
.stl-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:10px;gap:6px}
.stl-tag{position:absolute;top:8px;right:8px;font-size:.7rem;padding:3px 9px;border-radius:999px;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.4);color:var(--cyan);font-weight:600;letter-spacing:.03em;pointer-events:none;z-index:2}
#p-design .card h3{margin-bottom:4px}
#p-design .card p{font-size:.92rem}
ul.dots{padding-left:20px;margin:8px 0 4px}
ul.dots li{margin-bottom:4px}
ul.dots li::marker{color:var(--cyan)}

/* Smart Classroom: wide feature on desktop, stacked on smaller screens */
.proj-smart{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start}
.proj-smart>*{min-width:0}
.proj-smart .media-top{margin:0;border-radius:12px}
.proj-smart .media-top img{object-fit:contain;background:var(--card-2)}
.proj-smart .pics{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.proj-smart .pics img{height:auto;aspect-ratio:4/3;object-fit:contain;background:var(--card-2)}
@media (max-width:991.98px){.proj-smart{grid-template-columns:minmax(0,1fr);gap:16px}}

/* videos */
.vid{aspect-ratio:16/9;background:var(--card-2);border-radius:12px;display:grid;place-items:center;color:var(--muted);overflow:hidden;margin-bottom:12px;position:relative;text-align:center;padding:0 12px}
.vid:has(iframe),.vid:has(.vid-poster){padding:0}
.vid iframe,.vid video{width:100%;height:100%;border:0}
.vid-poster{position:absolute;inset:0;cursor:pointer;background:#000}
.vid-poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75}
.vid-play{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:rgba(17,20,23,.75);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;color:var(--cyan);transition:transform .15s,background .15s}
.vid-poster:hover .vid-play{transform:scale(1.08);background:var(--cyan);color:#06222b}
.vid-play svg{width:24px;height:24px;margin-left:3px}

/* timeline */
.tl{list-style:none;border-left:2px solid var(--line);padding-left:18px;display:grid;gap:14px;margin-left:6px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,8,10,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:1100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-width:min(100%,1200px);max-height:78vh;border-radius:8px;box-shadow:0 20px 60px -20px #000}
.lb .cap{margin-top:12px;text-align:center;max-width:720px;padding:0 50px}
.lb .cap span{color:var(--muted);font-size:.85rem}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.4rem;color:#fff}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-close{top:calc(14px + env(safe-area-inset-top));right:14px}.lb-prev{left:14px;top:50%;transform:translateY(-50%)}.lb-next{right:14px;top:50%;transform:translateY(-50%)}
@media (max-width:600px){.lb-prev,.lb-next{top:auto;bottom:calc(18px + env(safe-area-inset-bottom));transform:none}.lb .cap{padding:0 56px}}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:22px 0}
footer .container-xl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
@media (max-width:575.98px){footer .container-xl{justify-content:center;text-align:center}}
.to-top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:46px;height:46px;border-radius:50%;
  background:var(--cyan);color:#06222b;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -4px rgba(34,211,238,.6);opacity:0;transform:translateY(12px) scale(.8);
  pointer-events:none;transition:opacity .25s ease,transform .25s ease,bottom .25s ease}
.to-top svg{width:22px;height:22px}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:active{transform:scale(.9)}

/* motion polish — GSAP drives it when available; plain CSS transitions are the fallback */
.intro .cover-img,.intro .head,.intro .tabs .tab,.intro .tab-ink{opacity:0}
.reveal{transition:opacity .5s cubic-bezier(.22,.61,.36,1),transform .5s cubic-bezier(.22,.61,.36,1)}
.reveal:not(.in){opacity:0;transform:translateY(16px)}
.gs .reveal{transition:none}
.gs .card.reveal.in{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
@media (hover:hover){
  .card .media-top img,.cert img,.pics img{transition:transform .35s cubic-bezier(.22,.61,.36,1)}
  .card:hover .media-top img,.cert:hover img,.pics img:hover{transform:scale(1.045)}
  .mini-grid img,.photo-grid img{transition:filter .2s ease}
  .mini-grid img:hover,.photo-grid img:hover{filter:brightness(1.12)}
}
/* ---------- extras ---------- */
/* reading-progress line along the very top */
.progress-top{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--cyan),var(--cyan-2),#a5f3fc);box-shadow:0 0 10px rgba(34,211,238,.7)}
/* back-to-top button doubles as a progress ring */
.to-top{background:conic-gradient(#e9fdff var(--p,0deg),rgba(6,34,43,.35) 0)}
.to-top::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--cyan)}
.to-top svg{position:relative}
/* sliding highlight behind the active section tab (desktop) */
.tab-ink{display:none}
@media (min-width:992px){
  .has-ink{position:relative}
  .has-ink .tab{position:relative;z-index:1}
  .has-ink .tab.on{background:transparent;border-color:transparent;box-shadow:none}
  .has-ink .tab-ink{display:block;position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;z-index:0;pointer-events:none;
    background:var(--cyan);box-shadow:0 4px 18px -4px rgba(34,211,238,.75)}
}
/* soft cyan spotlight that follows the mouse across cards (desktop) */
@media (hover:hover) and (pointer:fine){
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(34,211,238,.075),transparent 45%)}
  .card:hover::after{opacity:1}
  #p-design .card::after{display:none}
  .hl-item{position:relative;overflow:hidden}
  .hl-item::before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-18deg);transition:left .6s ease}
  .hl-item:hover::before{left:120%}
  .gs .cert:hover{transform:none}
}
/* shimmer placeholder while photos load */
@keyframes shimmer{to{background-position:-200% 0}}
.pics img:not(.ok),.cert img:not(.ok),.photo-grid img:not(.ok),.mini-grid img:not(.ok),.media-top img:not(.ok){
  background:linear-gradient(100deg,var(--card-2) 30%,#2c353f 50%,var(--card-2) 70%) 0 0/200% 100%;animation:shimmer 1.3s linear infinite}
/* the photo glows a little on hover */
@media (hover:hover){.avatar{transition:transform .35s cubic-bezier(.22,.61,.36,1)}.avatar:hover{transform:scale(1.04) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* tabs */
let cur=(location.hash||"#home").slice(1); if(!TABS.some(t=>t[0]===cur))cur="home";
let firstGo=true;
const scrollMemory={}, visitedTabs=new Set();
/* .tabs is position:sticky — once the page has scrolled, its offsetTop stops meaning
   "height of the header" and instead reflects wherever it's currently pinned, which is
   basically always ≈ the current scroll position. That made every top/bottom check below
   compare a number against itself. Cache the real header height once, before anything
   has scrolled, and reuse that fixed number everywhere instead of re-reading offsetTop. */
const HEADER_H=document.querySelector(".tabs").offsetTop;
/* go(tab)          — from the menu / swipe: top of a new page, or where you left off
   go(tab, anchor)  — from a "Highlights" link: open that page and jump straight to that item */
function go(t,anchor){
  const prevScroll=window.scrollY; /* capture BEFORE the panel swap */
  if(cur) scrollMemory[cur]=prevScroll;
  const firstVisit=!visitedTabs.has(t);
  cur=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  document.querySelectorAll(".panel").forEach(p=>{
    const isTarget=p.id==="p-"+t;
    p.classList.toggle("on",isTarget);
    p.classList.remove("show");
    if(isTarget) requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add("show")));
  });
  history.replaceState(null,"","#"+t);
  visitedTabs.add(t);
  /* deferred one frame: mobile browsers often ignore a scrollTo() made synchronously
     inside a touch handler, right when the panel's display just changed */
  if(anchor&&t==="certs"&&certF!=="all"){ certF="all"; renderCerts(); }
  requestAnimationFrame(()=>{
    if(anchor&&scrollToAnchor(t,anchor)){
      /* jumped straight to the item */
    }else if(!firstVisit){
      scrollTo({top:scrollMemory[t]||0,behavior:"auto"});
    }else if(prevScroll>HEADER_H){
      scrollTo({top:HEADER_H,behavior:"auto"}); /* new page starts at the top, menu in view */
    }
    const fEl=document.querySelector("#p-"+t+" .filters");
    if(fEl) fEl.classList.toggle("at-end",fEl.scrollWidth<=fEl.clientWidth+2);
  });
  { /* keep the active tab in view inside the bar itself, without ever scrolling the page */
    const bar=document.querySelector(".tabs .wrap"), btn=bar&&bar.querySelector(`.tab[data-t="${t}"]`);
    if(bar&&btn&&bar.scrollWidth>bar.clientWidth+2) bar.scrollTo({left:btn.offsetLeft-bar.clientWidth/2+btn.offsetWidth/2,behavior:"smooth"});
  }
  updateMinibar(); closeSheet(); moveInk(); markLoaded();
  initStlViewers();
  setSwipeHintText();
  stopActiveVideo();
  document.querySelectorAll("#p-projects video").forEach(v=>v.pause());
  observeReveals();
  if(firstGo){firstGo=false;}else{hideSwipeHint();}}

function anchorTop(el){
  const phone=matchMedia("(max-width:700px)").matches;
  const offset=phone?16:document.querySelector(".tabs").offsetHeight+14; /* phones: bar is at the bottom; larger screens: clear the sticky top bar */
  return Math.max(0,el.getBoundingClientRect().top+scrollY-offset);
}
function scrollToAnchor(t,anchor){
  const el=document.querySelector(`#p-${t} [data-anchor="${anchor}"]`);
  if(!el)return false;
  if(el.classList.contains("reveal")){ revealObserver.unobserve(el); if(window.gsap) gsap.killTweensOf(el);
    el.style.transition="none"; el.classList.add("in"); if(window.gsap) gsap.set(el,{clearProps:"opacity,transform"});
    void el.offsetWidth; el.style.transition=""; }
  let y=anchorTop(el); scrollTo({top:y,behavior:"auto"});
  /* the page fades in and images above may still be loading; re-aim once things settle,
     unless the visitor has already started scrolling on their own */
  setTimeout(()=>{ if(Math.abs(scrollY-y)<4){ y=anchorTop(el); scrollTo({top:y,behavior:"smooth"}); } },450);
  el.classList.remove("anchor-flash"); void el.offsetWidth; el.classList.add("anchor-flash");
  return true;
}

/* ---------- videos: click-to-play, only one plays at a time ---------- */
let activeVideoEl=null;
function posterHTML(yt){
  return `<div class="vid-poster" data-yt="${yt}"><img src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" loading="lazy" alt="">
    <span class="vid-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>`;
}
function stopActiveVideo(){
  if(activeVideoEl && activeVideoEl.isConnected){
    const yt=activeVideoEl.dataset.yt;
    if(yt) activeVideoEl.innerHTML=posterHTML(yt);
  }
  activeVideoEl=null;
}
function playVideo(container){
  stopActiveVideo();
  document.querySelectorAll("#p-projects video").forEach(v=>v.pause());
  const yt=container.dataset.yt; if(!yt)return;
  container.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  activeVideoEl=container;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t)return go(t.dataset.t);
  const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go,g.dataset.anchor);
  const f=e.target.closest("[data-f]");if(f){certF=f.dataset.f;return renderCerts();}
  const vp=e.target.closest(".vid-poster");if(vp)return playVideo(vp.parentElement);
  const im=e.target.closest("[data-g]");if(im)openLB(im.dataset.g,+im.dataset.i);
});
document.addEventListener("play",e=>{ if(e.target.tagName==="VIDEO") stopActiveVideo(); },true);
/* fade the scroll hint on the filter chips once fully scrolled to the end */
document.addEventListener("scroll",e=>{
  const el=e.target;
  if(el && el.classList && el.classList.contains("filters")){
    el.classList.toggle("at-end", el.scrollLeft + el.clientWidth >= el.scrollWidth - 4);
  }
},true);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));render();go(cur);});

function openLB(k,i){LB=GROUPS[k]||[];LI=i;showLB();lb.classList.add("open");document.body.style.overflow="hidden"}
function showLB(){const it=LB[LI];if(!it)return;document.getElementById("lbImg").src=it.src;

/* swipe between tabs on main content, Reels-style */
(function(){
  const mainEl=document.querySelector("main");
  let sx0=0, sy0=0, active=false, skip=false;
  mainEl.addEventListener("touchstart",e=>{
    if(lb.classList.contains("open")){active=false;return;}
    skip=!!e.target.closest(".stl-viewer,.filters,.vid,video,iframe"); /* let 3D models, chip rows, and video players (including their seek bar) handle their own gestures */
    if(skip){active=false;return;}
    sx0=e.touches[0].clientX; sy0=e.touches[0].clientY; active=true;
  },{passive:true});
  mainEl.addEventListener("touchend",e=>{
    if(!active||skip){active=false;skip=false;return;}
    active=false;
    if(lb.classList.contains("open"))return;
    const dx=e.changedTouches[0].clientX-sx0, dy=e.changedTouches[0].clientY-sy0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){
      const idx=TABS.findIndex(x=>x[0]===cur);
      hideSwipeHint();
      if(dx<0 && idx<TABS.length-1) go(TABS[idx+1][0]);
      else if(dx>0 && idx>0) go(TABS[idx-1][0]);
    }
  },{passive:true});
})();

/* ---------- STL 3D viewers: ONE shared WebGL renderer, many 2D "screens" ----------
   Why some models turned white on Android: every card used to create its own WebGL
   context (10 of them). Android Chrome keeps only a handful of GPU contexts alive and
   silently kills the oldest when memory gets tight; a killed context shows as a white or
   gray box that never comes back.
   The fix is the standard technique for many 3D views on one page: the whole site has
   exactly ONE WebGL context, kept off-screen. Every card shows an ordinary 2D <canvas>.
   Each frame the shared renderer draws a card's scene and the picture is copied onto that
   card's 2D canvas. 2D canvases are not affected by the WebGL context limit and keep their
   last picture even if the GPU context ever resets, so a card can no longer go white.
   Extra safety: models far off-screen release their GPU memory (re-uploaded automatically
   when they come back), downloads are lazy and queued, a reset context is recovered or
   rebuilt, and nothing renders while a model is off-screen or the tab is hidden. */
const STL={renderer:null,lost:false,w:0,h:0,views:[],geo:new Map(),queue:[],loading:0,raf:0,lostT:0};
const STL_PAR=2;
const STL_TOUCH=matchMedia("(pointer:coarse)").matches;
const STL_DPR=Math.min(window.devicePixelRatio||1, STL_TOUCH?1.5:2);

function stlRenderer(){
  if(STL.renderer) return STL.renderer;
  let r;
  try{ r=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"}); }
  catch(e){ return null; }
  r.setPixelRatio(1); r.setClearColor(0x000000,0);
  r.domElement.addEventListener("webglcontextlost",e=>{
    e.preventDefault(); STL.lost=true;
    clearTimeout(STL.lostT); STL.lostT=setTimeout(stlRebuildRenderer,2500); /* not restored in time → start fresh */
  });
  r.domElement.addEventListener("webglcontextrestored",()=>{
    clearTimeout(STL.lostT); STL.lost=false; STL.w=STL.h=0;
    STL.views.forEach(v=>v.dirty=true); stlKick();
  });
  STL.renderer=r; STL.w=STL.h=0;
  return r;
}
function stlRebuildRenderer(){
  try{ STL.renderer&&STL.renderer.dispose(); }catch(e){}
  STL.renderer=null; STL.lost=false;
  stlRenderer(); STL.views.forEach(v=>v.dirty=true); stlKick();
}
function stlText(key){
  const t={
    wait:["รอโหลดโมเดล 3D…","Waiting to load 3D model…"],
    load:["กำลังโหลดโมเดล 3D…","Loading 3D model…"],
    fail:["โหลดไฟล์ 3D ไม่สำเร็จ แตะเพื่อลองใหม่","Couldn't load the 3D file — tap to retry"],
    nogl:["อุปกรณ์นี้แสดงโมเดล 3D ไม่ได้","This device can't show 3D models"],
    tapIdle:["แตะเพื่อหมุนดูโมเดล","Tap to rotate the model"],
    tapOn:["หมุน / ซูมได้ · แตะนอกกรอบเพื่อเลื่อนหน้า","Rotate / pinch to zoom · tap outside to scroll"],
    mouse:["ลากเพื่อหมุน · คลิกแล้วเลื่อนลูกกลิ้งเพื่อซูม","Drag to rotate · click, then scroll to zoom"]
  }[key];
  return L==="th"?t[0]:t[1];
}
function stlMsg(v,text,retry){
  let l=v.el.querySelector(".stl-loading");
  if(!l){ l=document.createElement("div"); l.className="stl-loading"; v.el.appendChild(l); }
  l.textContent=text; l.style.cursor=retry?"pointer":""; l.onclick=retry||null;
}
function stlClearMsg(v){ const l=v.el.querySelector(".stl-loading"); if(l)l.remove(); }
function stlHint(v){
  let h=v.el.querySelector(".stl-hint");
  if(!h){ h=document.createElement("div"); h.className="stl-hint"; v.el.appendChild(h); }
  h.textContent=STL_TOUCH?(v.active?stlText("tapOn"):stlText("tapIdle")):stlText("mouse");
}
function stlSize(v){
  if(!v.cv)return;
  const w=Math.max(1,Math.round(v.el.clientWidth*STL_DPR)), h=Math.max(1,Math.round(v.el.clientHeight*STL_DPR));
  if(v.cv.width!==w||v.cv.height!==h){
    v.cv.width=w; v.cv.height=h;
    v.camera.aspect=w/h; v.camera.updateProjectionMatrix();
    v.dirty=true; stlKick();
  }
}
function stlActivate(v){
  if(!STL_TOUCH||v.active||!v.ready)return;
  v.active=true; v.controls.enabled=true; v.controls.enableZoom=true; v.controls.autoRotate=false;
  v.cv.style.touchAction="none"; v.el.classList.add("active"); stlHint(v);
}
function stlDeactivate(v){
  if(!v.ready)return;
  if(STL_TOUCH){
    if(!v.active)return;
    v.active=false; v.controls.enabled=false; v.controls.enableZoom=false;
    v.cv.style.touchAction="pan-y"; v.el.classList.remove("active"); stlHint(v);
  }else{ v.controls.enableZoom=false; }
}
function stlBuild(v,geo){
  if(!v.el.isConnected)return;
  if(!stlRenderer()){ stlMsg(v,stlText("nogl")); return; }
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff,0x1b2932,1.15));
  const d1=new THREE.DirectionalLight(0xffffff,.85); d1.position.set(4,6,5); scene.add(d1);
  const d2=new THREE.DirectionalLight(0x22d3ee,.3); d2.position.set(-4,-2,-3); scene.add(d2);
  const r=(geo.boundingSphere&&geo.boundingSphere.radius)||40;
  const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.2,roughness:.45}));
  scene.add(mesh);
  const camera=new THREE.PerspectiveCamera(45,16/9,r/100,r*50);
  camera.position.set(r*1.7,r*1.3,r*1.7);
  const cv=document.createElement("canvas"); cv.className="stl-canvas";
  v.el.insertBefore(cv,v.el.firstChild);
  const ctx=cv.getContext("2d");
  const controls=new THREE.OrbitControls(camera,cv);
  controls.enableDamping=true; controls.dampingFactor=.08;
  controls.autoRotate=true; controls.autoRotateSpeed=1.6;
  controls.enablePan=false; controls.enableZoom=false;
  controls.enabled=!STL_TOUCH;            /* touch: first tap activates, so the page still scrolls */
  cv.style.touchAction=STL_TOUCH?"pan-y":"none"; /* OrbitControls forces 'none'; restore scrolling */
  controls.addEventListener("start",()=>{ controls.autoRotate=false; v.el.classList.add("used"); });
  controls.addEventListener("change",()=>{ v.dirty=true; stlKick(); });
  controls.target.set(0,0,0); controls.update();
  cv.addEventListener("contextrestored",()=>{ v.dirty=true; stlKick(); }); /* 2D canvas reset → just redraw */
  Object.assign(v,{scene,camera,controls,cv,ctx,mesh,ready:true,dirty:true,active:false});
  if(STL_TOUCH) v.el.addEventListener("click",()=>stlActivate(v));
  else{
    v.el.addEventListener("click",()=>{ controls.enableZoom=true; });
    v.el.addEventListener("mouseleave",()=>{ controls.enableZoom=false; });
  }
  v.ro=new ResizeObserver(()=>stlSize(v)); v.ro.observe(v.el);
  stlClearMsg(v); stlSize(v); stlHint(v); stlKick();
}
function stlGeometry(src,onProgress){
  if(STL.geo.has(src))return STL.geo.get(src);
  const p=new Promise((res,rej)=>{
    new THREE.STLLoader().load(src,geo=>{
      geo.computeVertexNormals(); geo.center(); geo.computeBoundingSphere(); res(geo);
    },onProgress,rej);
  });
  STL.geo.set(src,p);
  p.catch(()=>STL.geo.delete(src)); /* allow retry */
  return p;
}
function stlLoad(v){
  v.loading=true; STL.loading++;
  stlMsg(v,stlText("load"));
  const done=()=>{ v.loading=false; STL.loading--; stlPump(); };
  stlGeometry(v.src,xhr=>{
    if(xhr.lengthComputable&&xhr.total) stlMsg(v,stlText("load")+" "+Math.round(xhr.loaded/xhr.total*100)+"%");
  }).then(geo=>{ done(); stlBuild(v,geo); },
          ()=>{ done(); stlMsg(v,stlText("fail"),()=>stlEnqueue(v)); });
}
function stlPump(){ while(STL.loading<STL_PAR&&STL.queue.length) stlLoad(STL.queue.shift()); }
function stlEnqueue(v){
  if(v.ready||v.loading||STL.queue.includes(v))return;
  stlMsg(v,stlText("wait")); STL.queue.push(v); stlPump();
}
function stlKick(){ if(!STL.raf) STL.raf=requestAnimationFrame(stlTick); }
function stlTick(){
  STL.raf=0;
  if(document.hidden)return;
  let keep=false;
  for(const v of STL.views){
    if(!v.ready||!v.visible)continue;
    v.controls.update();                       /* fires 'change' while rotating/damping → dirty */
    if(v.controls.autoRotate) keep=true;
    if(!v.dirty||STL.lost)continue;
    const r=stlRenderer(); if(!r)break;
    /* the loss event arrives a moment after the GPU actually drops the context; never copy a
       frame rendered on a dead context, or the card would be wiped to blank */
    if(r.getContext().isContextLost()){ STL.lost=true; break; }
    const w=v.cv.width,h=v.cv.height;
    if(STL.w!==w||STL.h!==h){ r.setSize(w,h,false); STL.w=w; STL.h=h; }
    r.render(v.scene,v.camera);
    v.ctx.clearRect(0,0,w,h);
    v.ctx.drawImage(r.domElement,0,0);
    v.dirty=false;
    keep=true;                                  /* keep ticking so damping can settle */
  }
  if(keep) stlKick();
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){ STL.views.forEach(v=>v.dirty=true); stlKick(); }
});
/* tap anywhere outside an active model → give scrolling back to the page */
document.addEventListener("pointerdown",e=>{
  STL.views.forEach(v=>{ if(v.active&&!v.el.contains(e.target)) stlDeactivate(v); });
},{passive:true});
/* on screen (with a small margin) → render;  off screen → stop rendering + release touch */
const stlVisIO=new IntersectionObserver(es=>es.forEach(en=>{
  const v=en.target._stl; if(!v)return;
  v.visible=en.isIntersecting;
  if(v.visible){ v.dirty=true; stlKick(); } else stlDeactivate(v);
}),{rootMargin:"150px"});
/* near the screen → download; far away → free GPU memory (CPU copy kept, re-uploaded on return) */
const stlNearIO=new IntersectionObserver(es=>es.forEach(en=>{
  const v=en.target._stl; if(!v)return;
  v.near=en.isIntersecting;
  if(v.near){ if(!v.ready) stlEnqueue(v); }
  else if(v.ready&&v.mesh) v.mesh.geometry.dispose();
}),{rootMargin:"900px"});

function initStlViewers(){
  if(typeof THREE==="undefined"||!THREE.STLLoader||!THREE.OrbitControls)return;
  /* drop views whose card was re-rendered (e.g. after switching language) */
  STL.views=STL.views.filter(v=>{
    if(v.el.isConnected)return true;
    stlVisIO.unobserve(v.el); stlNearIO.unobserve(v.el);
    if(v.ro)v.ro.disconnect();
    const qi=STL.queue.indexOf(v); if(qi>=0)STL.queue.splice(qi,1);
    return false;
  });
  document.querySelectorAll(".stl-viewer[data-stl]").forEach(el=>{
    if(el._stl)return;
    if(!el.clientWidth||!el.clientHeight)return; /* panel hidden — retried next time the tab opens */
    const v={el,src:el.dataset.stl,ready:false,loading:false,visible:false,near:false};
    el._stl=v; STL.views.push(v);
    stlVisIO.observe(el); stlNearIO.observe(el);
  });
}

/* ---------- motion (GSAP) ---------- */
const GS=!!window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches;
if(GS) document.documentElement.classList.add("gs");
function heroIntro(){
  const root=document.documentElement;
  if(!GS){ root.classList.remove("intro"); return; }
  const parts=".cover-img,.head,.avatar,.who>*,.head-actions,.tabs .wrap .tab";
  const tl=gsap.timeline({defaults:{ease:"power3.out"},onComplete(){ gsap.set(parts,{clearProps:"opacity,transform"}); }});
  tl.fromTo(".cover-img",{opacity:0,scale:1.07},{opacity:1,scale:1,duration:1})
    .fromTo(".head",{opacity:0,y:24},{opacity:1,y:0,duration:.6},"-=.8")
    .fromTo(".avatar",{opacity:0,scale:.82},{opacity:1,scale:1,duration:.6,ease:"back.out(1.7)"},"-=.45")
    .fromTo(".who>*",{opacity:0,y:12},{opacity:1,y:0,duration:.45,stagger:.06},"-=.45")
    .fromTo(".head-actions",{opacity:0,y:10},{opacity:1,y:0,duration:.4},"-=.35")
    .fromTo(".tabs .wrap .tab",{opacity:0,y:8},{opacity:1,y:0,duration:.35,stagger:.025},"-=.3")
    .fromTo(".tab-ink",{opacity:0},{opacity:1,duration:.4},"<");
  root.classList.remove("intro");
}
/* gentle cover parallax — desktop mouse/trackpad only, uses the separate `translate`
   property so it never fights the intro animation's transform */
if(GS && matchMedia("(hover:hover) and (pointer:fine)").matches){
  const ci=document.querySelector(".cover-img"); let ticking=false;
  addEventListener("scroll",()=>{ if(ticking)return; ticking=true;
    requestAnimationFrame(()=>{ ticking=false; ci.style.translate=`0 ${Math.min(scrollY,400)*.11}px`; }); },{passive:true});
}

/* sliding highlight behind the active tab (desktop) */
function moveInk(){
  const bar=document.getElementById("tabs"); if(!GS){ bar.classList.remove("has-ink"); return; }
  bar.classList.add("has-ink");
  let ink=bar.querySelector(".tab-ink"), fresh=false;
  if(!ink){ ink=document.createElement("span"); ink.className="tab-ink"; bar.prepend(ink); fresh=true; }
  const on=bar.querySelector(".tab.on"); if(!on||on.offsetWidth===0) return;
  const to={x:on.offsetLeft,y:on.offsetTop,width:on.offsetWidth,height:on.offsetHeight};
  if(fresh||moveInk.instant) gsap.set(ink,to); else gsap.to(ink,{...to,duration:.45,ease:"power3.out",overwrite:true});
}
if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{ moveInk.instant=true; moveInk(); moveInk.instant=false; });
  ro.observe(document.getElementById("tabs")); }

/* desktop pointer niceties: card spotlight, certificate tilt, magnetic contact button */
if(GS && matchMedia("(hover:hover) and (pointer:fine)").matches){
  let pm=null, pmTick=false;
  document.addEventListener("pointermove",e=>{ pm=e; if(pmTick)return; pmTick=true; requestAnimationFrame(()=>{ pmTick=false;
    const c=pm.target.closest&&pm.target.closest(".card"); if(c){ const r=c.getBoundingClientRect();
      c.style.setProperty("--mx",(pm.clientX-r.left)+"px"); c.style.setProperty("--my",(pm.clientY-r.top)+"px"); }
    const ct=pm.target.closest&&pm.target.closest(".cert.in"); if(ct){ const r=ct.getBoundingClientRect();
      const rx=((pm.clientY-r.top)/r.height-.5)*-8, ry=((pm.clientX-r.left)/r.width-.5)*8;
      gsap.to(ct,{rotationX:rx,rotationY:ry,y:-4,transformPerspective:800,duration:.35,ease:"power2.out",overwrite:"auto"}); }
  }); },{passive:true});
  document.addEventListener("pointerout",e=>{ const ct=e.target.closest&&e.target.closest(".cert");
    if(ct&&!ct.contains(e.relatedTarget)) gsap.to(ct,{rotationX:0,rotationY:0,y:0,duration:.5,ease:"power3.out",overwrite:"auto",clearProps:"transform"}); });
  const mag=document.getElementById("btnContact"), mx=gsap.quickTo(mag,"x",{duration:.4,ease:"power3"}), my=gsap.quickTo(mag,"y",{duration:.4,ease:"power3"});
  mag.addEventListener("pointermove",e=>{ const r=mag.getBoundingClientRect(); mx((e.clientX-r.left-r.width/2)*.25); my((e.clientY-r.top-r.height/2)*.35); });
  mag.addEventListener("pointerleave",()=>{ mx(0); my(0); });
}

const sheetBS=()=>window.bootstrap&&bootstrap.Offcanvas?bootstrap.Offcanvas.getOrCreateInstance(sheet):null;
function openSheet(){ const o=sheetBS(); if(o) o.show(); else sheet.classList.add("show"); }
function closeSheet(){ if(window.bootstrap&&bootstrap.Offcanvas){ const o=bootstrap.Offcanvas.getInstance(sheet); if(o) o.hide(); } else sheet.classList.remove("show"); }

document.getElementById("mbPrev").addEventListener("click",()=>{ const i=TABS.findIndex(x=>x[0]===cur); if(i>0) go(TABS[i-1][0]); });

new IntersectionObserver(([en])=>{

new IntersectionObserver(([en])=>{ document.body.classList.toggle("scrolled",!en.isIntersecting&&en.boundingClientRect.top<0);
  moveInk.instant=true; moveInk(); moveInk.instant=false; })
  .observe(document.querySelector(".head"));
document.getElementById("brand").addEventListener("click",e=>{e.preventDefault();scrollTo({top:0,behavior:"smooth"});});

/* floating back-to-top button */
const toTopBtn=document.getElementById("toTop");
toTopBtn.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
const progTop=document.getElementById("progTop"); let progTick=false;
function updateProgress(){
  progTick=false;
  const max=document.documentElement.scrollHeight-innerHeight, p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  progTop.style.transform=`scaleX(${p})`; toTopBtn.style.setProperty("--p",(p*360).toFixed(1)+"deg");
}

  toTopBtn.classList.toggle("show", window.scrollY>HEADER_H*1.5);
  if(!progTick){ progTick=true; requestAnimationFrame(updateProgress); }
},{passive:true});
addEventListener("resize",()=>requestAnimationFrame(updateProgress));

/* scroll-reveal: fade+rise once, the first time a card/photo/cert enters view */
const revealObserver=new IntersectionObserver(entries=>{
  const els=entries.filter(en=>en.isIntersecting).map(en=>en.target);
  if(!els.length)return;
  els.forEach(el=>revealObserver.unobserve(el));
  if(!GS){ els.forEach(el=>el.classList.add("in")); return; }
  /* everything that enters together cascades in reading order */
  const pos=el=>{const r=el.getBoundingClientRect();return r.top*10000+r.left};
  els.sort((a,b)=>pos(a)-pos(b));
  gsap.fromTo(els,{opacity:0,y:18},{opacity:1,y:0,duration:.7,ease:"power3.out",stagger:.07,overwrite:true,
    onComplete(){ els.forEach(el=>{ el.classList.add("in"); gsap.set(el,{clearProps:"opacity,transform"}); }); }});
},{threshold:.12});
function observeReveals(){
  document.querySelectorAll(
    "#p-home .card, #p-robots .card, #p-projects .card, #p-certs .cert, #p-videos .card, #p-about .card"
    /* #p-design .card is deliberately excluded — animating transform/opacity on the card
       that wraps a live WebGL canvas is what caused the 3D models to flicker */
  ).forEach(el=>{
    if(el.classList.contains("reveal"))return;
    el.classList.add("reveal");
    revealObserver.observe(el);
  });
}
